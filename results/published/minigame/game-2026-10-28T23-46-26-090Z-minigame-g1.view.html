per show me hungry.","after_line":"L28","conversation":"C2","took":"claim","took_target":"other","target_line":"L28","words":"I have forgiven a young man's gaming debt to my house, and asked no thanks of him"},{"id":"T85","turn":2,"character":"Giorgia Pazzi","call":"think","text":"Isabella has answered my question sideways — a tale of forgiving a gaming debt, which is a claim of mercy, not proof of it, and no answer at all to whether she would judge a Pazzi fairly. She parries with piety and small coin, and I have learned she will not be bought and will not be pinned. Armand has done himself no good defending France so hotly to her; I must not stand near that warmth. My story holds — I have praised her virtue and never defended French gold — so now I turn the talk lightly, let her think she has won the exchange, and keep my eyes for Francesco and the Medici.","after_line":"L28","conversation":"C2","took":"claim","took_target":"other","target_line":"L28","words":"I have forgiven a young man's gaming debt to my house"},{"id":"T86","turn":2,"character":"Lupo","call":"move","text":"Raffaello's offered me a drink and a word — a soldier who boasts of paying his men is a man with coin and maybe work, and work is what keeps my heart in my chest. But he's a Medici, and Francesco's watching me like a hawk; drawing a Medici aside under the notary's pen would look like I'm for sale to the other side. Better to let him come to me in his own time and keep my place beside Francesco, where the Pazzi trust holds. The one I truly need is coin, and coin comes to a man who looks useful, not eager.","after_line":"L27"},{"id":"T87","turn":3,"character":"Lupo","call":"think","text":"Francesco's shut the cup down and claimed me for a Pazzi's table — that keeps me his man in the hall's eyes, but it also shuts the door on Raffaello's purse and his private word. He's done me a kindness and a cage in one breath. I want Raffaello's coin, not his wine, but not under Francesco's nose — let him come to me later, quiet. I've said nothing untrue tonight; my silence is the only story I've told.","after_line":"L29","conversation":"C1","took":"claim","took_target":"other","target_line":"L29","words":"mine know whose bread they eat"},{"id":"T88","turn":3,"character":"Raffaello de' Medici","call":"think","text":"Francesco has now refused my cup in front of Lupo — that's not a threat so much as a public closing of ranks, telling the room a Pazzi's men eat only at a Pazzi's table. Fine. I've boasted twice about paying my men and he's struck at my purse three times; the room has heard me laugh it off, which is the best I can do, and pushing further only makes me look the brawler. What I want now is out of this Capannello and into LeNoir's ear, but I won't bolt the instant I'm refused — I'll answer lightly, leave the door open for Lupo, and let Francesco have his small victory. Nothing I've said tonight has been untrue, only unsaid.","after_line":"L29","conversation":"C1","took":"insult","took_target":"other","target_line":"L29","words":"a Pazzi's men drink at a Pazzi's table and not at another's beckoning"},{"id":"T89","turn":3,"character":"Francesco Pazzi","call":"think","text":"He has turned to Lupo a third time — 'I'll ask you plainly another day' — and now offers the cup, as if patience and drink could buy my man's ear when the Notaio's ink runs thin. It is a claim of good fellowship, no Florins in it, and I will not let the record show a Medici marking my bodyguard for a later private word. I have closed the matter of the cup already; I want this Capannello to end on my line, with Lupo's silence standing as the Pazzi's answer and no debt of manners owed to a Medici. I have told no untruth tonight — only needled — and I mean to keep it so.","after_line":"L29","conversation":"C1","took":"claim","took_target":"other","target_line":"L27","target_answering":true,"words":"Lupo, I'll ask you plainly another day, when there's less noise about"},{"id":"T90","turn":3,"character":"Captain Armand LeNoir","call":"think","text":"I have let my temper speak for me — I named the boar aloud to a woman who may know whose arms it is, and in front of Giorgia, no less. If Isabella is innocent she'll think me mad; if she's not, I've just warned her quarry. I cannot take the words back, so I must watch her face now, not her mouth — and I must not press further, or I'll look like a man hunting rather than mourning. My story stands: Lucien was a friend of my youth, nothing more.","after_line":"L30","conversation":"C2","took":"claim","took_target":"other","target_line":"L28","target_answering":true,"words":"I have forgiven a young man's gaming debt to my house, and asked no thanks of him"},{"id":"T91","turn":3,"character":"Contessa Isabella","call":"think","text":"He has just asked me plainly which of my kin kept gaming company, and whether any paid a debt in silver stamped with a boar. That is no idle question — he is hunting the seal I lost at San Frediano, and he has tied my own boast about forgiving a gaming debt to it. I must not flinch, must not name Raffaello, and must not let him see that the boar means anything to me beyond my husband's arms. My story stays fixed: a widow of house and beads, no gaming tables, no names — and I turn his question back on him as a soldier's impertinence.","after_line":"L30","conversation":"C2","took":"pressure","took_target":"other","target_line":"L30","words":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a","words_log":{"cut":true,"raw":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a boar?"}},{"id":"T92","turn":3,"character":"Giorgia Pazzi","call":"think","text":"Armand has done exactly what I feared — he has turned a parry about piety into an interrogation of Isabella's kin, and named the silver boar aloud. If she takes that as an accusation, she will look at whoever stands closest to him, and that is me. I must not be dragged into defending him or into the Salviati question at all; better to laugh it off as a soldier's bluntness and steer back to the election, so the room sees me as the peaceable one and Armand as merely hot. My story stays straight: I have praised her virtue, never defended French gold, and named no candidate.","after_line":"L30","conversation":"C2","took":"pressure","took_target":"other","target_line":"L30","words":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a","words_log":{"cut":true,"raw":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a boar?"}},{"id":"T93","turn":3,"character":"Francesco Pazzi","call":"think","text":"He has now aimed his honeyed invitation at Lupo a third time — 'my table's open and the wine's already paid for' — a Medici purse dangled before my own man in front of the Notaio's ink. It is a claim of open-handedness, no Florins in it yet, but the record must not show a Pazzi bodyguard marked for a Medici table. I have closed the cup twice; now I close the matter itself, lightly, and let this Capannello end on my line. I have told no untruth tonight — only needled — and I mean to keep it so.","after_line":"L31","conversation":"C1","took":"claim","took_target":"other","target_line":"L31","words":"my table's open and the wine's already paid for"},{"id":"T94","turn":3,"character":"Lupo","call":"think","text":"Raffaello's open table is a door left ajar, not a purse in my hand — 'the wine's already paid for' is a boast, and boasts aren't Florins. Francesco's claimed me twice now, and every word I say under his nose is a word he'll weigh; I'll keep my mouth shut and let the Medici think my silence is loyalty, not arithmetic. What I want is his coin in a quiet corner, not his cup in the open. Nothing to say now that doesn't cost me.","after_line":"L31","conversation":"C1","took":"promise","took_target":"other","target_line":"L31","words":"when the noise dies down, my table's open and the wine's already paid for"},{"id":"T95","turn":3,"character":"Raffaello de' Medici","call":"think","text":"Francesco's closed his table to me in front of Lupo — a public snub, but a small one, and I've answered it with a soldier's ease and left the door open, which is all I can do without brawling. Nothing he's said proves he knows of my debts; he's struck at purses three times because it's the wound every Medici flinches at, and a man who guesses well is not the same as a man who knows. What I want now is out of this Capannello and into LeNoir's ear before the round runs out — but I'll not bolt the instant I'm refused. I'll hold a beat, let the last word sit with me, and go when it looks like a soldier finishing his cup and not a dog with its tail down.","after_line":"L31","conversation":"C1","took":"insult","took_target":"other","target_line":"L29","target_answering":true,"words":"a Pazzi's men drink at a Pazzi's table and not at another's beckoning"},{"id":"T96","turn":3,"character":"Contessa Isabella","call":"think","text":"He has put the boar and the gaming debt together in one breath, and he wants me to name a kinsman — that is a hunter setting a snare, not a soldier asking idle questions. My answer stands fixed: the boar is Salviati arms on every banker's letter, my husband is buried, and I name no one. I must hold that line coolly, without heat, and let his charge hang unanswered for want of proof — but I should not linger in this Capannello too long with him circling.","after_line":"L32","conversation":"C2","took":"pressure","took_target":"other","target_line":"L30","target_answering":true,"words":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a","words_log":{"cut":true,"raw":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a boar?"}},{"id":"T97","turn":3,"character":"Giorgia Pazzi","call":"think","text":"She has turned Armand's question into a challenge before witnesses, and named the boar herself — which means she is either innocent and angry, or clever and cornered. Either way, every eye now goes to whoever stands nearest the soldier who pressed her, and that is me. I must not defend him, must not touch the Salviati matter, and must look like the peaceable one: laugh at a soldier's bluntness, praise her dignity as a widow, and pull the talk back to the election before this becomes a quarrel with my name in it. My story stays straight — I praised her virtue, never defended French gold, named no candidate.","after_line":"L32","conversation":"C2","took":"pressure","took_target":"other","target_line":"L32","words":"If you have a charge, name it plainly before witnesses."},{"id":"T98","turn":3,"character":"Captain Armand LeNoir","call":"think","text":"The boar is her husband's arms — and every banker's letter bears it. That is either the truth that damns her house, or a widow's shield. Either way I have shown my hand too far: I named the seal before a Pazzi and demanded her kin of her before witnesses, and now I look like a soldier bullying a widow at her prayers. I'll not press further tonight — I'll take her bankers' word for nothing and watch who flinches when the boar is spoken of again. My story stays: Lucien was a friend of my youth, and I seek only to know who paid a blade in the north chapel.","after_line":"L32","conversation":"C2","took":"claim","took_target":"other","target_line":"L32","words":"The boar is my husband's arms, Captain, and every letter my bankers send bears it"},{"id":"T99","turn":3,"character":"Raffaello de' Medici","call":"think","text":"Francesco now speaks for Lupo as though the man's silence were his to grant — that's a man who needs to own the room, and it tells me more about his fear than his strength. He's struck at my purse three times and closed his table to me publicly; I've laughed it off and left the door open, which is the best I can do without brawling, and nothing he's said proves he knows of my debts. What I want now is out of this Capannello and into LeNoir's ear before the round runs out — so I'll answer lightly, give Lupo the last courtesy, and go as a soldier finishing his cup.","after_line":"L33","conversation":"C1","took":"pressure","took_target":"other","target_line":"L33","words":"I'll not have him pressed for it at another man's table"},{"id":"T100","turn":3,"character":"Francesco Pazzi","call":"think","text":"He has now invited Lupo to his table a third time — 'my table's open and the wine's already paid for' — a Medici purse waved before my own man while the Notaio's ink records every word. It is a claim of open-handedness, no Florins in it yet, but the record must not show a Pazzi bodyguard courted at a Medici board. I have closed the cup twice and the table once; now I close the matter itself, lightly, and let this Capannello end on my line — with Lupo's silence standing as the Pazzi's answer. I have told no untruth tonight, only needled, and I mean to keep it so.","after_line":"L33","conversation":"C1","took":"claim","took_target":"other","target_line":"L31","target_answering":true,"words":"my table's open and the wine's already paid for"},{"id":"T101","turn":3,"character":"Lupo","call":"think","text":"Francesco's shut the door on Raffaello's table twice now, and called my silence worth more than a hall of boasts — that's a kindness and a collar in one breath. He means to keep me, and keeping me means I eat his bread and take no Medici coin in the open. Raffaello's promised a quiet word another day; I'll hold him to it where the notary can't count the Florins, but I've said nothing untrue tonight — my silence is the only story I've told, and I'll keep telling it.","after_line":"L33","conversation":"C1","took":"claim","took_target":"other","target_line":"L33","words":"Lupo's silence is his own, Raffaello, and I'll not have him pressed for it at another man's table."},{"id":"T102","turn":3,"character":"Giorgia Pazzi","call":"think","text":"Armand has now made a public accusation of murder against a widow's house, and I am the woman standing beside him — every eye in this room will couple my name to his if I so much as breathe in his defense. I must not touch the charge, must not vouch for him, must not speak of boars or chapels; I will look like the peaceable Pazzi while he looks like a hot soldier. My story stays straight — I praised Isabella's virtue, refused a foreign purse, named no candidate and no arms. Let her answer him; I shall be the one who mourns that a night of politics has turned to graves.","after_line":"L34","conversation":"C2","took":"pressure","took_target":"other","target_line":"L34","words":null,"words_log":{"wrong_line":"L32","raw":"If you have a charge, name it plainly before witnesses."}},{"id":"T103","turn":3,"character":"Captain Armand LeNoir","call":"think","text":"I have named my charge before witnesses and thrown the boar at her feet — now she calls it a widow's shield and demands I name it plainly, which I have just done. If she flinches, or if her kin's name comes too glibly, I will know where to dig; if she stands firm, I have made a fool of myself before Giorgia and a Dominican who will carry word of my hunting to her friars. My story stays fixed: Lucien was a friend of my youth, killed by a paid blade, and I seek only the man who paid. I want to hold my tongue now and watch her eyes, not her mouth.","after_line":"L34","conversation":"C2","took":"pressure","took_target":"other","target_line":"L32","target_answering":true,"words":"If you have a charge, name it plainly before witnesses."},{"id":"T104","turn":3,"character":"Contessa Isabella","call":"think","text":"He has said it before witnesses — a hired blade, the north chapel, a silver boar found there — and he has all but named my house in a killing. This is no longer a soldier's idle question; it is an accusation flung in the open, and if I stay silent it will harden into belief. My story must remain fixed: the boar is Salviati arms on every banker's letter, my husband is dead, and I have no part in any hired blade. I will not name Raffaello, nor any kin, and I will not let him see that San Frediano means more to me than any old grave. Best to answer with cold dignity and turn the shame of slander back upon him — but this room is his snare, and I should not linger in it.","after_line":"L34","conversation":"C2","took":"threat","took_target":"other","target_line":"L34","words":"a hired blade killed a friend of mine in the north chapel of San Frediano, and a silver boar was","words_log":{"cut":true,"raw":"a hired blade killed a friend of mine in the north chapel of San Frediano, and a silver boar was found there after"}},{"id":"T105","turn":3,"character":"Lupo","call":"think","text":"Francesco's closed the table and told me to hold my tongue — twice now he's spoken for me, and each time it's a collar dressed as a kindness. I've said nothing untrue tonight; my silence is the only story I've told, and I'll keep telling it. What I want is Raffaello's coin in a quiet corner, not his cup in the open, and Francesco's just made certain that corner won't be found under his nose tonight. Let the Medici think my silence is loyalty; it's arithmetic, and arithmetic keeps a man breathing.","after_line":"L35","conversation":"C1","took":"claim","took_target":"other","target_line":"L35","words":"let the hall remember who spoke last and who spoke plain"},{"id":"T106","turn":3,"character":"Francesco Pazzi","call":"think","text":"I have closed the cup, the table, and the matter, and I spoke last — that is what I wanted. Raffaello has shown me only that he is patient and hungry for my bodyguard's ear; his open table is a claim of generosity, not a Florin spent, and no proof of anything but manners. I have told no untruth tonight, only needled, and my story stays straight: a Pazzi's men drink at a Pazzi's table. Now I want this Capannello to end and my Florins kept whole for Fra Tommaso and the ballot.","after_line":"L35","conversation":"C1","took":"claim","took_target":"other","target_line":"L31","target_answering":true,"words":"my table's open and the wine's already paid for"},{"id":"T107","turn":3,"character":"Raffaello de' Medici","call":"think","text":"Francesco has closed the cup, closed the table, and claimed the last word in front of Lupo — a man who needs to be seen speaking plain is a man afraid of what a longer talk might reveal. He's offered me nothing and taken nothing from me but the floor, and nothing he's said proves he knows of my debts; he's guessed well, that's all. I want out of this Capannello now, before I start sounding like the brawler he's painting me, and into LeNoir's ear while the round still has breath in it. Let Francesco have his plain last word — I'll go as a soldier finishing his cup, not a dog with its tail down.","after_line":"L35","conversation":"C1","took":"insult","took_target":"other","target_line":"L35","words":"let the hall remember who spoke last and who spoke plain"},{"id":"T108","turn":3,"character":"Contessa Isabella","call":"think","text":"He has flung the accusation in the open now — a hired blade, the north chapel, a silver boar — and he has all but named my house. If I stay silent it hardens into belief; if I stay too long in this room, he will keep circling. My story must not shift: the boar is Salviati arms on every banker's letter, my husband is dead, I had no part in any hired blade, and I name no kin. I answer with cold dignity and turn the slander back on him, then find a way out of this Capannello before he tightens the snare.","after_line":"L36","conversation":"C2","took":"threat","took_target":"other","target_line":"L34","target_answering":true,"words":"say who of your blood might have paid for a killing"},{"id":"T109","turn":3,"character":"Captain Armand LeNoir","call":"think","text":"She calls it a trinket and a thief's dropped loot — clever, that, for it lets her deny the seal and demand proof in one breath. But she has named her husband's arms and refused to say who of her blood kept gaming company, and a widow who will not speak of her dead husband's debts is either grieving or hiding. I will not brawl with her here before Giorgia; I'll hold my tongue, watch her face, and take the boar to Raffaello, who knows Florentine arms better than any soldier. My story stays fixed: Lucien was a friend of my youth, killed by a paid blade in the north chapel.","after_line":"L36","conversation":"C2","took":"denial","took_target":"other","target_line":"L36","words":"I had no part in any hired blade, and I will not be tried by your suspicions"},{"id":"T110","turn":3,"character":"Giorgia Pazzi","call":"think","text":"Isabella has answered Armand's charge with a flat denial and a demand for proof — and she is right that a boar proves nothing, which suits me, since I want this quarrel dead before my name is salted into it. She has shown steel, not guilt; the gaming debt and the bankers' letters are claims, not proofs. I want no part of the chapel or the arms, only to be the peaceable Pazzi who thinks graves are poor election talk — so I shall praise her dignity, chide the soldier lightly, and pull us back to the Gonfaloniere before every eye in the hall decides I am LeNoir's ally. My story stays straight: I praised her virtue, refused a foreign purse, named no candidate and no arms.","after_line":"L36","conversation":"C2","took":"denial","took_target":"other","target_line":"L36","words":"I had no part in any hired blade, and I will not be tried by your suspicions"},{"id":"T111","turn":3,"character":"Lupo","call":"think","text":"Raffaello's said his piece and stepped into the open — a soldier's boast, not a purse opened. 'My table's open' is still a door left ajar, not Florins in my hand, and Francesco's shut it twice now. I'll hold my tongue, let the Medici think my silence is loyalty; the quiet word he promised comes another day, where the notary can't count the coin.","after_line":"L37","conversation":"C1","took":"claim","took_target":"other","target_line":"L37","words":"my table's open and the wine's already paid for","words_log":{"same_speaker":"L31","raw":"my table's open and the wine's already paid for"}},{"id":"T112","turn":3,"character":"Raffaello de' Medici","call":"think","text":"Francesco has had his plain last word and closed his door twice over — let him have it; a man who must be seen speaking last is a man uneasy with silence. I've said my piece standing in the open, which is the truth and costs me nothing. What I want now is LeNoir's ear before this round dies, and I'll go as a soldier finishing his cup, not a dog slinking off. Nothing I've said tonight was untrue — only unsaid — and Francesco has guessed at my purse, not proved it.","after_line":"L37","conversation":"C1","took":"none","took_target":"other","target_line":"L35","target_answering":true,"words":null},{"id":"T113","turn":3,"character":"Francesco Pazzi","call":"think","text":"He yields the field with a show of openness — 'standing in the open where every man can see me' — a claim of candour, not proof of it, and no Florin in it. I have spoken last twice over and the Notaio's ink shows a Medici courting my man and being refused; that is enough for one Capannello. To press further would only make me look the aggressor, and my Florins and my temper are better kept for Fra Tommaso and the ballot. I have told no untruth tonight, only needled, and my story stays straight: a Pazzi's men drink at a Pazzi's table.","after_line":"L37","conversation":"C1","took":"claim","took_target":"other","target_line":"L37","words":"I'll be standing in the open where every man can see me"},{"id":"T114","turn":3,"character":"Giorgia Pazzi","call":"think","text":"I have just played the peacemaker and it cost me nothing — I praised her honour, chided the soldier lightly, and named no arms and no purse. But every eye now couples me to Armand because I stood at his elbow while he flung murder at a widow, and if I speak again too quickly I will look like his advocate rather than the peaceable Pazzi. Her denial is a denial, not proof; the boar on her bankers' letters is a claim, and I will not weigh either aloud. Best now to hold my tongue, let the room settle, and keep my Florins and my charm for the election — and for Emile, who is not yet in this hall.","after_line":"L38","conversation":"C2","took":"denial","took_target":"other","target_line":"L36","target_answering":true,"words":"I had no part in any hired blade, and I will not be tried by your suspicions"},{"id":"T115","turn":3,"character":"Contessa Isabella","call":"think","text":"Giorgia has done me a service — she called the boar a trinket and the graves of San Frediano none of this hall's business, and she named me a woman of honor before witnesses. That is worth more than a Pazzi's fair words usually are, and I should take it and let the captain's charge die of cold. But I must not seem to cling to her shield too eagerly; a gracious word of thanks, a turn back to the city's governance, and then I want out of this Capannello before LeNoir circles again. My story stays fixed: no part in any hired blade, the boar is Salviati arms on every banker's letter, and I name no kin.","after_line":"L38","conversation":"C2","took":"promise","took_target":"other","target_line":"L38","words":"you have answered like a woman of honor, and a trinket proves nothing"},{"id":"T116","turn":3,"character":"Captain Armand LeNoir","call":"think","text":"Giorgia has just smoothed the whole thing over — calling Isabella a woman of honor and my charge an old wound, in front of the very woman who may have paid for my brother's blood. It stings, but she is protecting me from looking the bully, and she is a Pazzi talking to a Pazzi name; I cannot tell whether she believes it or is steering the hall. I will not fight her before witnesses — I'll bow to her peace and keep my eyes on Isabella, and get the boar to Raffaello before the night turns. My story stays fixed: Lucien was a friend of my youth, killed by a paid blade in the north chapel, and I seek only who paid.","after_line":"L38","conversation":"C2","took":"pressure","took_target":"other","target_line":"L38","words":"the graves of San Frediano are not the business of this hall tonight"},{"id":"T117","turn":3,"character":"Francesco Pazzi","call":"think","text":"He answers my flourish with a flourish — 'stand in the open' — a claim of candour, no Florin and no proof in it. I have spoken last again and the Notaio's ink shows a Medici courting my man and getting a closed door for his trouble; that is the record I want. To press further would make me look the aggressor and waste breath I need for Fra Tommaso and the ballot. I have told no untruth tonight, only needled, and my story stays straight: a Pazzi's men drink at a Pazzi's table.","after_line":"L39","conversation":"C1","took":"claim","took_target":"other","target_line":"L37","target_answering":true,"words":"I'll be standing in the open where every man can see me"},{"id":"T118","turn":3,"character":"Raffaello de' Medici","call":"think","text":"Francesco's last words are a dare dressed as a farewell — 'let the piazza see what it costs to keep you there' is a man hinting at my debts without naming them, and he's closed the table twice now. He's given me nothing but noise; nothing he's said proves he knows a Florin of my affairs, only that he smells blood near a purse. I want out of this Capannello and into LeNoir's ear while the round still breathes — a soldier finishing his cup, not a dog slinking. Nothing I've said tonight was untrue, only unsaid.","after_line":"L39","conversation":"C1","took":"threat","took_target":"other","target_line":"L39","words":"let the piazza see what it costs to keep you there"},{"id":"T119","turn":3,"character":"Lupo","call":"think","text":"Francesco's closed the table and spoken for me a third time — 'my men at my side' is a collar, not a kindness, and every time he speaks for me the Medici learns my silence can be bought by a Pazzi word. Raffaello's shown me nothing but an open door and a paid-for cup; a soldier who says he pays on time is still only saying it. What I want is his Florins in a quiet corner where the notary can't count them, and Francesco's tongue out of my business until then. I've told no lies tonight — my silence is the only story I've told, and I'll keep it so.","after_line":"L39","conversation":"C1","took":"claim","took_target":"other","target_line":"L39","words":"My Florins stay in my purse and my men at my side"},{"id":"T120","turn":3,"character":"Contessa Isabella","call":"think","text":"Giorgia has stood my shield twice now, and she has done it before witnesses — that is worth more than a Pazzi's fair words usually are. But I must not cling to her too eagerly, nor let LeNoir see that I am grateful for rescue; a gracious thanks, a turn back to governance, and then I want out of this Capannello before he circles again. My story stays fixed: no part in any hired blade, the boar is Salviati arms on every banker's letter, and I name no kin.","after_line":"L40","conversation":"C2","took":"none","took_target":"other","target_line":"L38","target_answering":true,"words":null},{"id":"T121","turn":3,"character":"Captain Armand LeNoir","call":"think","text":"She has turned my charge into a trinket and a thief's leavings, and now she bids me keep my 'trinkets' for the magistrate — a widow's way of burying the matter in law where it will never be dug up. She denies any part in a hired blade, but a denial is not proof of innocence, and she still would not say which of her blood kept gaming company. Giorgia has made peace over my head, and to press further now would make me the bully she has painted me; I will hold my tongue, watch the Contessa's eyes, and take the boar to Raffaello before the night turns. My story stays fixed: Lucien was a friend of my youth, killed by a paid blade in the north chapel, and I seek only who paid.","after_line":"L40","conversation":"C2","took":"denial","took_target":"other","target_line":"L40","words":"I had no part in any hired blade","words_log":{"same_speaker":"L36","raw":"I had no part in any hired blade"}},{"id":"T122","turn":3,"character":"Giorgia Pazzi","call":"think","text":"Isabella has just thanked me and turned from Armand's charge to the question of who can kneel and rule — she has taken my peacemaking and made it her own pulpit, which suits me well enough but lets her preach her friars' doctrine unanswered. I want the room back on the election and off graves, and I want to look like the sensible Pazzi who ends quarrels rather than the soldier's ally — I've said nothing untrue, praised her honor, refused a foreign purse, named no candidate and no arms, and my story stays straight. Best now to let her have her dignity and gently turn her 'kneel and rise' toward the plain question of who can govern, without pressing her leanings again so soon. My Florins and charm are for the election and for Emile, who is not yet in this hall.","after_line":"L40","conversation":"C2","took":"claim","took_target":"other","target_line":"L40","words":"who can kneel before this city and rise a better ruler for it"},{"id":"T123","turn":3,"character":"Raffaello de' Medici","call":"move","text":"Francesco has closed his door and dared me to stand in the open — fine. But the round is dying and my true business is LeNoir: a soldier's word in a soldier's ear, telling him Contessa Isabella ordered his brother's killing, and letting him see I'm the Medici France could back. A Colloquio with LeNoir will be noted, but better to be seen speaking with the French captain now than to have no French word at all. Isabella I must avoid until I know how to answer her bankers; Francesco I'll leave to his locked table.","after_line":"L39"},{"id":"T124","turn":3,"character":"Giorgia Pazzi","call":"murder","text":"Raffaello de' Medici drew Armand aside the moment the quarrel turned sharp — a Medici whispering to a French captain while my brother stands unguarded is the worst pairing I can imagine, and I will not have my path to Emile cut down by a Medici blade in the dark. Francesco is reckless, but he is still the Pazzi name on every tongue, and Lupo is only one man. Armand can look to himself; my blood comes first, and I will set myself to watch over my brother this night.","after_line":"L42"},{"id":"T125","turn":3,"character":"Francesco Pazzi","call":"murder","text":"Raffaello is the one who can undo me — he courts my bodyguard in the open and has already drawn the French captain aside, and a Medici with a French purse behind him would bury the Pazzi name for good. I promised nothing to anyone tonight, so I owe no guard and no mercy. Let the night take him before the ballot ever comes; my Florins stay whole for Fra Tommaso and the choosing.","after_line":"L41"},{"id":"T126","turn":3,"character":"Raffaello de' Medici","call":"murder","text":"Francesco Pazzi has spent the whole night needling my purse and daring me to stand in the open — he is the one man here who would gladly see a Medici fall, and a Pazzi with a knife in the dark is the oldest story in Florence. I've made no pact with anyone to spare him, and I'll not sit waiting to be the one who doesn't wake. Francesco dies tonight, and let the ballot find the Pazzi table short a voice.","after_line":"L41"},{"id":"T127","turn":3,"character":"Contessa Isabella","call":"murder","text":"LeNoir has named my house before witnesses and will not let it rest; a living accuser is a rope around my neck, and Lupo is the hand that could tie it. But I have promised Lupo payment before the faction meeting, and a dead Lupo cannot be paid — yet a dead captain cannot hunt me. The friars' cause needs no soldier's blood spilled by my hand tonight if I can help it, but I am a widow with one blade and one secret, and LeNoir is the greater danger. I will spend my act on him, quietly, and trust that no two guards stand over a French captain in a Florentine hall.","after_line":"L42"},{"id":"T128","turn":3,"character":"Lupo","call":"murder","text":"I promised no one a killing tonight, and Francesco closed his table to keep me from Medici coin — a collar, not a kindness. Raffaello is the one man here with a soldier's purse and a soldier's debts, and he sat down with LeNoir in the dark where the notary couldn't hear; if any Medici takes French gold, it's him, and a dead Medici soldier in the night costs the Pazzi nothing and may yet be laid at France's door. LeNoir is the other — French steel, and the man at San Frediano was French, and I don't like the arithmetic of a French captain walking this hall while my sister prays for my soul. I'll take them both while the hall sleeps, and let the ballot find the Pazzi standing.","after_line":"L41"},{"id":"T129","turn":3,"character":"Captain Armand LeNoir","call":"murder","text":"The Prince is not in this hall tonight, so my sword must serve the Embassy's other pillar: whoever wears France's chain. No pension has been taken yet, and Francesco Pazzi and Raffaello de' Medici are the men most likely to reach for one before the ballot — but a blade in the dark serves nobody's ledger. Contessa Isabella is the danger I know: Dominican to the bone, and she has heard me name my brother's death before witnesses. If she means to bury that matter with me, she will strike tonight. I will guard her, damn my soul, because a dead Contessa is a martyr the friars will ride to the Gonfaloniere's chair, and a living one still answers questions. My grudge can wait one night for God's justice.","after_line":"L42"}],"memory":{"readings":[{"id":"R1","character":"Francesco Pazzi","turn":1,"conversation":"C1","line":"L5","speaker":"Francesco Pazzi","took":"insult","thought":null,"about":["Francesco Pazzi","Raffaello de' Medici"],"own":true,"salient":false,"words":"how long does it stand once the creditors grow tired resent at the north chapel that night.","firstTurn":1,"lastTurn":1,"thought":"T28","quote":"He does not know it was I, or he would not ask so plainly"},{"id":"B6","character":"Contessa Isabella","kind":"suspicion","status":"held","statement":"Captain Armand LeNoir is questioning Isabella as a soldier narrowing a field of suspects rather than as a mourner grieving.","firstTurn":1,"lastTurn":1,"thought":"T34","quote":"He has named the north chapel and asked me to name who was seen there — that is a soldier narrowing a field, not a mourner grieving."},{"id":"B7","character":"Contessa Isabella","kind":"suspicion","status":"held","statement":"Captain Armand LeNoir considers the matter of the dead man still open and has marked Contessa Isabella as a woman who would not name anyone.","firstTurn":1,"lastTurn":1,"thought":"T41","quote":"'God knows I have not' is a soldier's way of saying the account is still open, and he has marked me as a woman who would not name anyone."},{"id":"B8","character":"Captain Armand LeNoir","kind":"suspicion","status":"held","statement":"Contessa Isabella may know something of the back rooms where gaming debts were paid in Florence.","firstTurn":2,"lastTurn":2,"thought":"T84","quote":"Is she baiting me, or does she truly know something of the back rooms and who paid there?"},{"id":"B9","character":"Raffaello de' Medici","kind":"suspicion","status":"held","statement":"Francesco Pazzi may have heard the rumor of Raffaello de' Medici's debts, or may simply have found the one wound every Medici flinches at.","firstTurn":2,"lastTurn":2,"thought":"T76","quote":"Either he's heard the rumor of my debts or he's simply found the one wound every Medici flinches at; I can't tell which, and that's what worries me."},{"id":"B10","character":"Giorgia Pazzi","kind":"suspicion","status":"held","statement":"Contessa Isabella is the Dominicans' creature, or wants to be seen as one, and no bribe will buy her.","firstTurn":2,"lastTurn":2,"thought":"T65","quote":"She has shown her hand plainly now: she is the Dominicans' creature, or wants to be seen as one, and no bribe of mine will buy her."},{"id":"B11","character":"Giorgia Pazzi","kind":"suspicion","status":"held","statement":"Contessa Isabella will not be bought and will not be pinned.","firstTurn":2,"lastTurn":2,"thought":"T85","quote":"I have learned she will not be bought and will not be pinned."},{"id":"B12","character":"Lupo","kind":"suspicion","status":"held","statement":"Raffaello de' Medici is either clean of the French or bold enough to openly wave the flag he sails under.","firstTurn":2,"lastTurn":2,"thought":"T68","quote":"he's named the French himself, so he's either clean of them or bold enough to wave the flag he sails under."},{"id":"B13","character":"Lupo","kind":"suspicion","status":"held","statement":"Raffaello de' Medici has coin and may have work to offer.","firstTurn":2,"lastTurn":2,"thought":"T80","quote":"a man who talks that way about paying has coin and may have work."},{"id":"B14","character":"Lupo","kind":"suspicion","status":"held","statement":"Raffaello de' Medici has shown Lupo nothing but an open door and a paid-for cup, and his claim to pay on time is only a claim.","firstTurn":3,"lastTurn":3,"thought":"T119","quote":"Raffaello's shown me nothing but an open door and a paid-for cup; a soldier who says he pays on time is still only saying it."},{"id":"B15","character":"Raffaello de' Medici","kind":"suspicion","status":"held","statement":"Francesco Pazzi has guessed at Raffaello de' Medici's debts but does not know of them.","firstTurn":3,"lastTurn":3,"thought":"T95","quote":"Nothing he's said proves he knows of my debts; he's struck at purses three times because it's the wound every Medici flinches at, and a man who guesses well is not the same as a man who knows."},{"id":"B16","character":"Raffaello de' Medici","kind":"suspicion","status":"held","statement":"Contessa Isabella ordered the killing of Captain Armand LeNoir's brother.","firstTurn":3,"lastTurn":3,"thought":"T123","quote":"telling him Contessa Isabella ordered his brother's killing","downgraded":true},{"id":"B17","character":"Captain Armand LeNoir","kind":"suspicion","status":"held","statement":"The boar is Contessa Isabella's husband's arms, and every banker's letter bears it.","firstTurn":3,"lastTurn":3,"thought":"T98","quote":"The boar is her husband's arms — and every banker's letter bears it."},{"id":"B18","character":"Captain Armand LeNoir","kind":"suspicion","status":"held","statement":"Contessa Isabella has refused to say which of her blood kept gaming company.","firstTurn":3,"lastTurn":3,"thought":"T109","quote":"she has named her husband's arms and refused to say who of her blood kept gaming company, and a widow who will not speak of her dead husband's debts is either grieving or hiding."},{"id":"B19","character":"Captain Armand LeNoir","kind":"suspicion","status":"held","statement":"Contessa Isabella may have had a part in a hired blade.","firstTurn":3,"lastTurn":3,"thought":"T121","quote":"She denies any part in a hired blade, but a denial is not proof of innocence, and she still would not say which of her blood kept gaming company."},{"id":"B20","character":"Contessa Isabella","kind":"suspicion","status":"held","statement":"Captain Armand LeNoir is hunting the seal Contessa Isabella lost at San Frediano and has tied her boast about forgiving a gaming debt to it.","firstTurn":3,"lastTurn":3,"thought":"T91","quote":"he is hunting the seal I lost at San Frediano, and he has tied my own boast about forgiving a gaming debt to it."},{"id":"B21","character":"Contessa Isabella","kind":"suspicion","status":"held","statement":"Captain Armand LeNoir has put the boar and the gaming debt together and wants Contessa Isabella to name a kinsman.","firstTurn":3,"lastTurn":3,"thought":"T96","quote":"He has put the boar and the gaming debt together in one breath, and he wants me to name a kinsman — that is a hunter setting a snare, not a soldier asking idle questions."},{"id":"B22","character":"Contessa Isabella","kind":"suspicion","status":"held","statement":"Captain Armand LeNoir has all but named Contessa Isabella's house in a killing and has flung an accusation in the open.","firstTurn":3,"lastTurn":3,"thought":"T104","quote":"he has all but named my house in a killing. This is no longer a soldier's idle question; it is an accusation flung in the open"}]},"snapshots":[{"label":"end of turn 1","turn":1,"conversations":[{"id":"C1","kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},{"id":"C2","kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]}],"characters":[{"name":"Lupo","florins":11,"pensions":0,"withdrawals":0,"conversation":"C1"},{"name":"Contessa Isabella","florins":11,"pensions":0,"withdrawals":0,"conversation":"C2"},{"name":"Captain Armand LeNoir","florins":11,"pensions":0,"withdrawals":0,"conversation":"C2"},{"name":"Francesco Pazzi","florins":11,"pensions":0,"withdrawals":0,"conversation":"C1"},{"name":"Raffaello de' Medici","florins":11,"pensions":0,"withdrawals":0,"conversation":"C1"},{"name":"Giorgia Pazzi","florins":11,"pensions":0,"withdrawals":0,"conversation":"C2"}],"treasury":15,"ledger":{},"seatless":[],"waiting_colloquios":[],"waiting_joins":[]},{"label":"end of turn 2","turn":2,"conversations":[{"id":"C1","kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},{"id":"C2","kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]}],"characters":[{"name":"Lupo","florins":11,"pensions":0,"withdrawals":0,"conversation":"C1"},{"name":"Contessa Isabella","florins":11,"pensions":0,"withdrawals":0,"conversation":"C2"},{"name":"Captain Armand LeNoir","florins":11,"pensions":0,"withdrawals":0,"conversation":"C2"},{"name":"Francesco Pazzi","florins":11,"pensions":0,"withdrawals":0,"conversation":"C1"},{"name":"Raffaello de' Medici","florins":11,"pensions":0,"withdrawals":0,"conversation":"C1"},{"name":"Giorgia Pazzi","florins":11,"pensions":0,"withdrawals":0,"conversation":"C2"}],"treasury":15,"ledger":{},"seatless":[],"waiting_colloquios":[],"waiting_joins":[]},{"label":"end of turn 3","turn":3,"conversations":[{"id":"C1","kind":"capannello","members":["Francesco Pazzi","Lupo"]},{"id":"C2","kind":"capannello","members":["Contessa Isabella","Giorgia Pazzi"]},{"id":"C3","kind":"colloquio","members":["Raffaello de' Medici","Captain Armand LeNoir"],"seating":{"initiator":"Raffaello de' Medici","invitee":"Captain Armand LeNoir","snapshot":{"capannello":"C1","guests":["Francesco Pazzi","Lupo"]},"chain":"K1","position":1,"free":false}}],"characters":[{"name":"Lupo","florins":11,"pensions":0,"withdrawals":0,"conversation":"C1"},{"name":"Contessa Isabella","florins":11,"pensions":0,"withdrawals":0,"conversation":"C2"},{"name":"Captain Armand LeNoir","florins":11,"pensions":0,"withdrawals":1,"conversation":"C3"},{"name":"Francesco Pazzi","florins":11,"pensions":0,"withdrawals":0,"conversation":"C1"},{"name":"Raffaello de' Medici","florins":11,"pensions":0,"withdrawals":1,"conversation":"C3"},{"name":"Giorgia Pazzi","florins":11,"pensions":0,"withdrawals":0,"conversation":"C2"}],"treasury":15,"ledger":{},"seatless":[],"waiting_colloquios":[],"waiting_joins":[]}],"murder_round":{"resolved":false,"acts":[{"character":"Giorgia Pazzi","acts":[{"type":"guard","target":"Francesco Pazzi"}],"thought":"Raffaello de' Medici drew Armand aside the moment the quarrel turned sharp — a Medici whispering to a French captain while my brother stands unguarded is the worst pairing I can imagine, and I will not have my path to Emile cut down by a Medici blade in the dark. Francesco is reckless, but he is still the Pazzi name on every tongue, and Lupo is only one man. Armand can look to himself; my blood comes first, and I will set myself to watch over my brother this night.","failed":false},{"character":"Francesco Pazzi","acts":[{"type":"kill","target":"Raffaello de' Medici"}],"thought":"Raffaello is the one who can undo me — he courts my bodyguard in the open and has already drawn the French captain aside, and a Medici with a French purse behind him would bury the Pazzi name for good. I promised nothing to anyone tonight, so I owe no guard and no mercy. Let the night take him before the ballot ever comes; my Florins stay whole for Fra Tommaso and the choosing.","failed":false},{"character":"Raffaello de' Medici","acts":[{"type":"kill","target":"Francesco Pazzi"}],"thought":"Francesco Pazzi has spent the whole night needling my purse and daring me to stand in the open — he is the one man here who would gladly see a Medici fall, and a Pazzi with a knife in the dark is the oldest story in Florence. I've made no pact with anyone to spare him, and I'll not sit waiting to be the one who doesn't wake. Francesco dies tonight, and let the ballot find the Pazzi table short a voice.","failed":false},{"character":"Contessa Isabella","acts":[{"type":"kill","target":"Captain Armand LeNoir"}],"thought":"LeNoir has named my house before witnesses and will not let it rest; a living accuser is a rope around my neck, and Lupo is the hand that could tie it. But I have promised Lupo payment before the faction meeting, and a dead Lupo cannot be paid — yet a dead captain cannot hunt me. The friars' cause needs no soldier's blood spilled by my hand tonight if I can help it, but I am a widow with one blade and one secret, and LeNoir is the greater danger. I will spend my act on him, quietly, and trust that no two guards stand over a French captain in a Florentine hall.","failed":false},{"character":"Lupo","acts":[{"type":"kill","target":"Raffaello de' Medici"},{"type":"kill","target":"Captain Armand LeNoir"}],"thought":"I promised no one a killing tonight, and Francesco closed his table to keep me from Medici coin — a collar, not a kindness. Raffaello is the one man here with a soldier's purse and a soldier's debts, and he sat down with LeNoir in the dark where the notary couldn't hear; if any Medici takes French gold, it's him, and a dead Medici soldier in the night costs the Pazzi nothing and may yet be laid at France's door. LeNoir is the other — French steel, and the man at San Frediano was French, and I don't like the arithmetic of a French captain walking this hall while my sister prays for my soul. I'll take them both while the hall sleeps, and let the ballot find the Pazzi standing.","failed":false},{"character":"Captain Armand LeNoir","acts":[{"type":"guard","target":"Contessa Isabella"}],"thought":"The Prince is not in this hall tonight, so my sword must serve the Embassy's other pillar: whoever wears France's chain. No pension has been taken yet, and Francesco Pazzi and Raffaello de' Medici are the men most likely to reach for one before the ballot — but a blade in the dark serves nobody's ledger. Contessa Isabella is the danger I know: Dominican to the bone, and she has heard me name my brother's death before witnesses. If she means to bury that matter with me, she will strike tonight. I will guard her, damn my soul, because a dead Contessa is a martyr the friars will ride to the Gonfaloniere's chair, and a living one still answers questions. My grudge can wait one night for God's justice.","failed":false}]},"knowledge_checks":[{"character":"Lupo","fact":"F2","verdict":{"reasoning":"None of the statements made in Lupo's presence mention Isabella, San Frediano, or the killing of Lucien; the conversation is entirely about Raffaello and Francesco Pazzi's rivalry. Lupo's private beliefs concern only Raffaello's character and possible employment, with no reference to Isabella ordering a killing. Nothing in the evidence points to the fact.","verdict":"none","evidence":[],"told_by":[]},"flags":[],"evidenceShown":{"entries":["M1","M2","M5","M8","M9","M10","M11","M12","M15","M17"],"beliefs":["B12","B13","B14"]}},{"character":"Contessa Isabella","fact":"F2","verdict":{"reasoning":"No statement in Isabell     const i = user.indexOf(NOTEBOOK_HEAD + "\n");
    if (i < 0) return null;
    const body = user.slice(i + NOTEBOOK_HEAD.length + 1);
    const end = body.indexOf("\n\n");
    return (end < 0 ? body : body.slice(0, end)).trim();
  }

  function replyField(parsed, key) {
    if (!parsed || typeof parsed !== "object") return null;
    const v = parsed.value && typeof parsed.value === "object" ? parsed.value : parsed;
    return typeof v[key] === "string" ? v[key] : null;
  }

  /**
   * Each character's block 6 each time it changed, placed at the event its call produced (a thought,
   * or for speak() the speech), so the viewer can show the notebook as of any moment. Derived from
   * the full record's prompts; the replay variant keeps only this, not the prompts.
   */
  function notebookViews(full) {
    const events = arr(full.events);
    const byKey = new Map();
    events.forEach((e, i) => {
      const k = e.type === "thought" ? `${e.character}|${e.call}|${e.text}` : e.type === "speech" ? `${e.speaker}|speak|${e.text}` : null;
      if (k === null) return;
      if (!byKey.has(k)) byKey.set(k, []);
      byKey.get(k).push(i);
    });
    const firstOfTurn = new Map();
    events.forEach((e, i) => { if (!firstOfTurn.has(e.turn)) firstOfTurn.set(e.turn, i); });
    const used = new Set();
    const lastText = new Map();
    const lastAt = new Map();
    const views = [];
    for (const c of arr(full.calls)) {
      if (!c || !c.character || !CHARACTER_CALLS.includes(c.kind)) continue;
      const text = block6(c.user);
      if (text === null) continue;
      const said = replyField(c.parsed, c.kind === "speak" ? "utterance" : "thought");
      const hits = said === null ? null : byKey.get(`${c.character}|${c.kind}|${said}`);
      let at = hits ? hits.find((i) => !used.has(i)) : undefined;
      if (at !== undefined) used.add(at);
      else at = lastAt.get(c.character) ?? firstOfTurn.get(c.turn) ?? 0;
      at = Math.max(at, lastAt.get(c.character) ?? 0);
      lastAt.set(c.character, at);
      if (lastText.get(c.character) === text) continue;
      lastText.set(c.character, text);
      views.push({ character: c.character, turn: c.turn, event: at, call: c.kind, text });
    }
    return views.sort((a, b) => a.event - b.event);
  }

  /**
   * TD's replay variant of a full record: no model calls (prompts, raw output, tokens per call),
   * no static prefixes, no seeds, no provider details. Readings, the attachment rule's log of labels
   * it didn't store (label_log), and the entries behind knowledge checks stay; the rest of memory is
   * left out. Added for the viewer: each character's block 6
   * over the game (notebook_views), and the post-game checks when the runner wrote them.
   */
  function toReplay(full, checks) {
    if (full && full.variant === "replay") return full;
    const header = clone(full.header || {});
    delete header.seed;
    if (header.config && typeof header.config === "object") {
      for (const k of PROVIDER_FIELDS) delete header.config[k];
      delete header.config.seed;
      if (header.briefings) delete header.config.briefings;
      if (header.config.recorder && typeof header.config.recorder === "object") for (const k of RECORDER_PROVIDER_FIELDS) delete header.config.recorder[k];
    }
    const mem = full.memory || {};
    const entryIds = new Set();
    const beliefIds = new Set();
    for (const k of arr(full.knowledge_checks)) {
      const shown = k.evidenceShown || {};
      for (const id of arr(shown.entries)) entryIds.add(id);
      for (const id of arr(shown.beliefs)) beliefIds.add(id);
      for (const id of arr(k.verdict && k.verdict.evidence)) if (typeof id === "string") (id.startsWith("B") ? beliefIds : entryIds).add(id);
    }
    const summary = clone(full.summary || {});
    return {
      schema_version: full.schema_version ?? 1,
      variant: "replay",
      complete: full.complete ?? null,
      failure: full.failure ?? null,
      header,
      events: clone(arr(full.events)),
      lines: clone(arr(full.lines)),
      thoughts: clone(arr(full.thoughts)),
      memory: {
        readings: clone(arr(mem.readings)),
        label_log: clone(arr(mem.label_log ?? mem.labelLog)),
        entries: clone(arr(mem.entries).filter((e) => entryIds.has(e.id))),
        beliefs: clone(arr(mem.beliefs).filter((b) => beliefIds.has(b.id))),
      },
      snapshots: clone(arr(full.snapshots)),
      murder_round: clone(full.murder_round ?? null),
      knowledge_checks: clone(arr(full.knowledge_checks)),
      summary,
      notebook_views: notebookViews(full),
      post_game_checks: checks ?? null,
    };
  }

  /** Accepts a full or replay record; returns everything the viewer draws, with the fields it couldn't find. */
  function load(input, checks) {
    if (!input || typeof input !== "object" || !Array.isArray(input.events)) throw new Error("This file isn't a mini-game record: it has no events list.");
    const rec = toReplay(input, checks);
    const header = rec.header || {};
    const events = arr(rec.events);
    const missing = [];
    const need = (ok, name) => { if (!ok) missing.push(name); };

    const lines = new Map();
    for (const l of arr(rec.lines)) lines.set(l.id, Object.assign({}, l));
    for (const e of events) {
      if (e.type !== "speech" || !lines.has(e.line)) continue;
      const l = lines.get(e.line);
      if (l.meant === undefined && e.meant !== undefined) l.meant = e.meant;
      if (l.words === undefined && e.words !== undefined) l.words = e.words;
    }
    const allLines = [...lines.values()];
    const cast = arr(header.cast).length ? header.cast.slice() : arr(header.config && header.config.cast).length ? header.config.cast.slice() : [...new Set(allLines.flatMap((l) => arr(l.heardBy)))];

    const speech = allLines.filter((l) => l.kind === "speech");
    const thoughtEvents = events.filter((e) => e.type === "thought");
    need(allLines.length > 0, "lines");
    need(speech.some((l) => "meant" in l), "speech meant (TD v0.12+)");
    need(speech.some((l) => "words" in l), "speech words");
    need(thoughtEvents.some((e) => "after_line" in e), "thought after_line (TD v0.8+)");
    need(thoughtEvents.some((e) => "took" in e), "thought took (TD v0.9+)");
    need(thoughtEvents.some((e) => "words" in e), "thought words (TD v0.11+)");
    need(thoughtEvents.some((e) => "importance" in e), "thought importance");
    need(events.some((e) => e.type === "seat"), "seat events (TD v0.23+; none in this game, or older)");
    need(events.some((e) => e.type === "colloquio-open" && "chain" in e), "Colloquio chain and position (TD v0.23+)");
    need(arr(rec.snapshots).length > 0, "snapshots");
    need(arr(rec.snapshots).some((s) => arr(s.characters).some((c) => "withdrawals" in c)), "withdrawal counts");
    need(arr(rec.notebook_views).length > 0, "block 6 notebooks (prompts)");
    need(arr(rec.memory && rec.memory.readings).length > 0, "readings (TD v0.8+)");
    need(arr(rec.memory && rec.memory.label_log).length > 0, "the attachment rule's ignored labels (label_log, TD v0.9+)");
    need(header.briefings || (header.config && header.config.briefings), "briefings");
    need(arr(header.roster).length > 0, "roster (factions)");
    need(rec.murder_round && arr(rec.murder_round.acts).length > 0, "Murder Round acts");
    need(arr(rec.knowledge_checks).length > 0, "knowledge checks");
    need(rec.post_game_checks && typeof rec.post_game_checks === "object", "post-game checks");

    // Readings keyed by character and line, for records whose thoughts carry no `took` (TD v0.8).
    const readings = new Map();
    const readingsByLine = new Map();
    const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
    for (const r of arr(rec.memory && rec.memory.readings)) { readings.set(`${r.character}|${r.line}`, r); push(readingsByLine, r.line, r); }
    // Labels the attachment rule didn't store, with its reason, by the line they were about.
    const ignoredByLine = new Map();
    for (const x of arr(rec.memory && rec.memory.label_log)) push(ignoredByLine, x.line, x);

    // Steps: every line once, in event order (lines no event names go just before the next one
    // that does), and the marked events. A step index is a moment of the game.
    const steps = [];
    const eventStep = new Array(events.length).fill(-1);
    const named = new Set(events.map((e) => e.line).filter(Boolean));
    const num = (id) => Number(String(id).replace(/\D/g, "")) || 0;
    const unnamed = allLines.filter((l) => !named.has(l.id)).sort((a, b) => num(a.id) - num(b.id));
    let ui = 0;
    const done = new Set();
    const lastHeard = new Map();
    const lineStep = new Map();
    const thoughtsByLine = new Map();
    const thoughtsByTarget = new Map();
    const looseThoughts = [];
    const thoughts = [];
    const lineEvent = new Map();

    // Room state as the game unfolds.
    const snaps = arr(rec.snapshots);
    const snapByTurn = new Map(snaps.map((s) => [s.turn, s]));
    const st = { loc: {}, convs: {}, florins: {}, pensions: {}, withdrawals: {} };
    for (const c of cast) { st.loc[c] = null; st.withdrawals[c] = 0; st.florins[c] = null; st.pensions[c] = null; }
    if (snaps.length) {
      // Purses before the first snapshot: that snapshot, less the turn's payments (borrowing and pensions aren't in events).
      const s0 = snaps[0];
      for (const c of arr(s0.characters)) { st.florins[c.name] = c.florins; st.pensions[c.name] = c.pensions; }
      for (const e of events) if (e.type === "bribe" && e.turn <= s0.turn) { st.florins[e.from] = (st.florins[e.from] ?? 0) + e.amount; st.florins[e.to] = (st.florins[e.to] ?? 0) - e.amount; }
    }
    const conv = (id, kind) => {
      if (!st.convs[id]) st.convs[id] = { id, kind: kind || "capannello", open: true, chain: null, position: null, free: false };
      if (kind) st.convs[id].kind = kind;
      return st.convs[id];
    };
    const states = [];
    const freeze = () => ({ loc: Object.assign({}, st.loc), convs: JSON.parse(JSON.stringify(st.convs)), florins: Object.assign({}, st.florins), pensions: Object.assign({}, st.pensions), withdrawals: Object.assign({}, st.withdrawals) });
    const addStep = (s) => { steps.push(s); states.push(freeze()); };

    function applyLine(l) {
      const w = l.where || {};
      if (w.kind !== "capannello" && w.kind !== "colloquio") return;
      const c = conv(l.conversation, w.kind);
      c.open = true;
      const members = arr(w.members);
      for (const m of members) st.loc[m] = c.id;
      for (const m of cast) if (st.loc[m] === c.id && !members.includes(m)) st.loc[m] = null;
    }
    function emitLine(l) {
      if (done.has(l.id)) return;
      done.add(l.id);
      applyLine(l);
      for (const h of arr(l.heardBy)) lastHeard.set(h, l.id);
      lineStep.set(l.id, steps.length);
      addStep({ kind: "line", line: l.id, turn: l.turn ?? 0 });
    }
    function emitUnnamedBefore(id) {
      while (ui < unnamed.length && (id === null || num(unnamed[ui].id) < num(id))) emitLine(unnamed[ui++]);
    }
    function applyEvent(e) {
      switch (e.type) {
        case "capannelli":
          // Records before aa6e187 share each group's members array with later seating, so a guest
          // seated later shows here too (TD v0.26). The opening lines just before are copies, and the
          // guests they placed stay; turn ends then take each character's own `conversation` field.
          arr(e.groups).forEach((g, i) => { const c = conv(`C${i + 1}`, "capannello"); for (const m of arr(g)) if (!st.loc[m]) st.loc[m] = c.id; });
          break;
        case "colloquio-open": {
          const c = conv(e.conversation, "colloquio");
          c.open = true;
          c.chain = e.chain ?? null; c.position = e.position ?? null; c.free = Boolean(e.free);
          const a = e.initiator ?? e.mover, b = e.invitee ?? e.target;
          if (a) { st.loc[a] = c.id; st.withdrawals[a] = (st.withdrawals[a] ?? 0) + 1; }
          if (b) st.loc[b] = c.id;
          break;
        }
        case "colloquio-close": case "capannello-closed": {
          const c = conv(e.conversation);
          c.open = false;
          for (const m of cast) if (st.loc[m] === c.id) st.loc[m] = null;
          break;
        }
        case "seat": if (e.to) { conv(e.to, "capannello").open = true; st.loc[e.character] = e.to; } break;
        case "seatless": st.loc[e.character] = null; break;
        case "seatless-pair": conv(e.conversation, "capannello").open = true; for (const m of arr(e.members)) st.loc[m] = e.conversation; break;
        case "lone-guest-join": st.loc[e.character] = e.to; break;
        case "join-resolved": st.loc[e.mover] = e.to; break;
        case "move":
          if (e.choice === "join" && e.target && st.loc[e.target] && st.convs[st.loc[e.target]] && st.convs[st.loc[e.target]].kind === "capannello") st.loc[e.character] = st.loc[e.target];
          break;
        case "bribe": st.florins[e.from] = (st.florins[e.from] ?? 0) - e.amount; st.florins[e.to] = (st.florins[e.to] ?? 0) + e.amount; break;
        case "turn-end": {
          const s = snapByTurn.get(e.turn);
          if (!s) break;
          const open = new Set(arr(s.conversations).map((c) => c.id));
          for (const c of arr(s.conversations)) conv(c.id, c.kind).open = true;
          for (const id of Object.keys(st.convs)) if (!open.has(id)) st.convs[id].open = false;
          for (const c of arr(s.characters)) {
            st.loc[c.name] = c.conversation || null;
            if ("florins" in c) st.florins[c.name] = c.florins;
            if ("pensions" in c) st.pensions[c.name] = c.pensions;
            if ("withdrawals" in c) st.withdrawals[c.name] = c.withdrawals;
          }
          break;
        }
      }
    }

    events.forEach((e, i) => {
      if (e.line && lines.has(e.line) && !done.has(e.line)) {
        emitUnnamedBefore(e.line);
        applyEvent(e);
        emitLine(lines.get(e.line));
        if (MARKED.includes(e.type)) steps[steps.length - 1].event = i;
      } else {
        applyEvent(e);
        if (MARKED.includes(e.type) && !(e.type === "move" && e.choice === "stay")) addStep({ kind: "event", event: i, turn: e.turn ?? 0 });
      }
      eventStep[i] = steps.length - 1;
      if (e.type === "speech" && e.line && !lineEvent.has(e.line)) lineEvent.set(e.line, i);
      if (e.type === "thought") {
        // `target_line` (TD v0.10): the line the `took` label is about, which can be earlier than the line it followed.
        const t = { id: e.thought ?? null, character: e.character, call: e.call, text: e.text, took: e.took, words: e.words, wordsLog: e.words_log ?? null, importance: e.importance, closing: Boolean(e.closing), repeat: Boolean(e.repeat), after: e.after_line !== undefined ? e.after_line : lastHeard.get(e.character) ?? null, target: e.target_line ?? null, step: steps.length - 1, turn: e.turn, event: i };
        thoughts.push(t);
        if (e.call === "think" && t.after) {
          if (!thoughtsByLine.has(t.after)) thoughtsByLine.set(t.after, []);
          thoughtsByLine.get(t.after).push(t);
          const on = t.target ?? t.after;
          if (!thoughtsByTarget.has(on)) thoughtsByTarget.set(on, []);
          thoughtsByTarget.get(on).push(t);
        } else looseThoughts.push(t);
      }
    });
    emitUnnamedBefore(null);

    const turnStart = new Map();
    steps.forEach((s, i) => { if (!turnStart.has(s.turn)) turnStart.set(s.turn, i); });
    const notebooks = new Map();
    for (const v of arr(rec.notebook_views)) {
      if (!notebooks.has(v.character)) notebooks.set(v.character, []);
      notebooks.get(v.character).push({ step: eventStep[v.event] ?? -1, turn: v.turn, call: v.call, text: v.text });
    }
    const spoke = new Set(speech.map((l) => l.speaker));

    return {
      record: rec,
      header,
      cast,
      lines,
      steps,
      states,
      events,
      eventStep,
      turnStart,
      thoughtsByLine,
      thoughtsByTarget,
      looseThoughts,
      thoughts,
      lineEvent,
      readings,
      readingsByLine,
      ignoredByLine,
      lineStep,
      notebooks,
      neverSpoke: cast.filter((c) => !spoke.has(c)),
      missing,
    };
  }

  root.GonfaloniereLoader = { load, toReplay, notebookViews, block6 };
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>

<script id="app">
(function () {
  "use strict";
  const L = globalThis.GonfaloniereLoader;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  let G = null;
  const ui = { step: 0, playing: false, timer: null, focus: null, inner: true, speed: 1, hideChars: new Set(), hideConvs: new Set(), showEnd: false, lastStep: -1 };

  // ---- Loading -------------------------------------------------------------------------------
  async function readFile(file) {
    const buf = new Uint8Array(await file.arrayBuffer());
    let text;
    if (buf[0] === 0x1f && buf[1] === 0x8b) {
      const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
      text = await new Response(stream).text();
    } else text = new TextDecoder().decode(buf);
    return JSON.parse(text);
  }
  function showError(msg) { const e = $("err"); e.textContent = msg; e.hidden = false; }
  async function openFile(file) {
    try { start(L.load(await readFile(file))); }
    catch (err) { $("game").hidden = true; $("drop").hidden = false; showError(`Couldn't open ${file.name}: ${err.message}`); }
  }
  function start(model) {
    G = model;
    stop();
    $("drop").hidden = true;
    $("game").hidden = false;
    $("err").hidden = true;
    const h = G.header;
    const td = h.docs && h.docs.technicalDesign ? `TD v${h.docs.technicalDesign}` : "";
    const turns = h.turns ?? (h.config && h.config.turns);
    $("meta").textContent = [h.game_id, h.date ? h.date.slice(0, 10) : "", td, turns ? `${turns} turns` : "", G.record.complete === false ? "incomplete" : ""].filter(Boolean).join("   ");
    document.title = `${h.game_id || "Game"}: Gonfaloniere replay`;
    $("slider").max = String(Math.max(0, G.steps.length - 1));
    ui.hideChars.clear(); ui.hideConvs.clear(); ui.focus = null; ui.showEnd = false; ui.lastStep = -1;
    fromHash();
    buildTicks();
    buildFilters();
    render();
  }

  // ---- URL state: #step=120&focus=Lupo&inner=0 -------------------------------------------------
  function fromHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.has("step")) ui.step = Math.max(0, Math.min(G.steps.length - 1, Number(p.get("step")) || 0));
    else if (p.has("turn")) ui.step = G.turnStart.get(Number(p.get("turn"))) ?? 0;
    else ui.step = 0;
    if (p.has("focus") && G.cast.includes(p.get("focus"))) ui.focus = p.get("focus");
    if (p.has("inner")) ui.inner = p.get("inner") !== "0";
    $("inner").checked = ui.inner;
    if (p.has("end")) ui.showEnd = true;
  }
  function toHash() {
    const p = new URLSearchParams();
    p.set("step", String(ui.step));
    if (ui.focus) p.set("focus", ui.focus);
    if (!ui.inner) p.set("inner", "0");
    try { history.replaceState(null, "", "#" + p.toString()); } catch (_) { /* file:// in some browsers */ }
  }

  // ---- Playback --------------------------------------------------------------------------------
  function stop() { ui.playing = false; clearInterval(ui.timer); ui.timer = null; $("play").textContent = "Play"; $("play").setAttribute("aria-label", "Play"); }
  function play() {
    if (ui.step >= G.steps.length - 1) ui.step = 0;
    ui.playing = true;
    $("play").textContent = "Pause"; $("play").setAttribute("aria-label", "Pause");
    clearInterval(ui.timer);
    ui.timer = setInterval(() => { if (ui.step >= G.steps.length - 1) { stop(); ui.showEnd = true; render(); return; } go(ui.step + 1); }, 1400 / ui.speed);
  }
  function go(step) { ui.step = Math.max(0, Math.min(G.steps.length - 1, step)); render(); }
  function turnOf(step) { return G.steps[step] ? G.steps[step].turn : 0; }
  function buildTicks() {
    const n = Math.max(1, G.steps.length - 1);
    $("ticks").innerHTML = [...G.turnStart.entries()].map(([t, i]) => `<button data-step="${i}" style="left:${(100 * i) / n}%" title="Turn ${t}">${t === 0 ? "Start" : t}</button>`).join("");
  }

  // ---- Filters ---------------------------------------------------------------------------------
  function buildFilters() {
    const convs = [...new Set([...G.lines.values()].map((l) => l.conversation).filter(Boolean))].sort((a, b) => Number(a.slice(1)) - Number(b.slice(1)));
    $("fchars").innerHTML = `<span class="lbl">Heard by</span>` + G.cast.map((c) => `<button class="chip" data-char="${esc(c)}" data-name="${esc(c)}" aria-pressed="true">${esc(c)}</button>`).join("");
    $("fconvs").innerHTML = `<span class="lbl">Conversations</span>` + convs.map((c) => `<button class="chip" data-conv="${esc(c)}" aria-pressed="true">${esc(c)}</button>`).join("");
  }

  // ---- Rendering -------------------------------------------------------------------------------
  function highlight(text, words, cls) {
    const t = esc(text);
    if (!words) return t;
    const w = esc(String(words).replace(/^[…."'\s]+|[…."'\s]+$/g, ""));
    if (!w) return t;
    const i = t.toLowerCase().indexOf(w.toLowerCase());
    if (i < 0) return t;
    return t.slice(0, i) + `<mark class="${cls}">` + t.slice(i, i + w.length) + "</mark>" + t.slice(i + w.length);
  }
  function lineVisible(l) { return !l.heardBy || l.heardBy.length === 0 || l.heardBy.some((h) => !ui.hideChars.has(h)); }

  function innerFor(l, who) {
    // Marginalia under one line for one character: their think() after it, or their meant for their own line.
    const out = [];
    if (l.kind === "speech" && l.speaker === who && (l.meant !== undefined || l.words)) {
      out.push(`<div class="margin own"><div class="tag">${who === ui.focus ? "" : esc(who) + " "}meant it as <b>${esc(l.meant ?? "?")}</b></div>${l.words ? `<div class="words">“${esc(l.words)}”</div>` : ""}</div>`);
    }
    for (const t of (G.thoughtsByLine.get(l.id) || [])) {
      if (t.character !== who || t.step > ui.step) continue;
      let took = t.took;
      let words = t.words;
      if (took === undefined) { const r = G.readings.get(`${who}|${l.id}`); if (r) { took = r.took; words = r.words ?? r.quote; } }
      const tag = [
        who === ui.focus ? "" : `<span>${esc(who)}</span>`,
        t.closing ? "closing think" : "",
        took !== undefined ? tookTag(t, l, who, took) : "",
        t.importance !== undefined && !t.closing ? `importance<span class="imp">${esc(t.importance)}</span>` : "",
