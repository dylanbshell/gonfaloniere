on your soul?","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"none","words":null},{"id":"L9","turn":1,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Francesco Pazzi","addressee":null,"text":"What a Pazzi wants is simple enough: what was taken from us, given back — honour, office, and the city's respect. But you've answered my question with a boast about credit, Raffaello, and a boast is what a man offers when the substance is thin. So tell me plainly: is there a Medici in this hall worth the name, or only ledgers?","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"insult","words":"a boast is what a man offers when the substance is thin"},{"id":"L10","turn":1,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Captain Armand LeNoir","addressee":null,"text":"A friend of my youth, no more — but a friend I loved, and I will not let his soul's account stay unsettled. The friars bid the guilty make peace; then they know more of that night than they preach. Tell me, Contessa, who was seen near the north chapel in those days?","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"none","words":null},{"id":"L11","turn":1,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Raffaello de' Medici","addressee":"Francesco Pazzi","text":"You want a Medici worth the name? Look at the one before you, not the ledgers. I've stood in the piazza with soldiers who'd follow me into fire, and no creditor's letter ever made them flinch — so ask yourself which of us the city would sooner have hold the staff.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"claim","words":"I've stood in the piazza with soldiers who'd follow me into fire"},{"id":"L12","turn":1,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Contessa Isabella","addressee":"Captain Armand LeNoir","text":"Captain, I was a widow in mourning in those years and kept to my own house and my beads — I can name no one honestly, and I will not guess where a man's life is at stake. If you loved your friend, ask the friars for a mass for his soul, and let God, who saw that night, settle the account.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"none","words":null},{"id":"L13","turn":1,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Francesco Pazzi","addressee":"Raffaello de' Medici","text":"Soldiers who'd follow you into fire — and yet here you stand in a borrowed hall, asking a Pazzi what he wants. I'll tell you plainly: I want the staff in my own hand, and I'd sooner trust a man who's earned his name than one who's merely inherited it.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"claim","words":"I want the staff in my own hand"},{"id":"L14","turn":1,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Captain Armand LeNoir","addressee":null,"text":"Then I shall do as you counsel, Contessa, and leave the friars to their masses. But a soldier does not forget a friend, and God, who saw that night, knows I have not. Let us speak of lighter things, if the company will have it.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"none","words":null},{"id":"L15","turn":1,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Raffaello de' Medici","addressee":"Francesco Pazzi","text":"Earned, you say — then let us both earn it where men are judged, not in a borrowed hall of whispers. I'll stand for the staff myself, Francesco, and we'll see which name the city reaches for when swords are counted and not ledgers.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"claim","words":"I'll stand for the staff myself"},{"id":"L16","turn":1,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Giorgia Pazzi","addressee":null,"text":"Well spoken, Contessa — discretion is a rare jewel, and rarer still in Florence. And you, Captain, do well to leave the dead their rest and turn your soldier's eye to the living; for the city will choose a Gonfaloniere soon, and I would sooner hear what the wise among us think of that than of old graves.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"none","words":null},{"id":"L17","turn":2,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Francesco Pazzi","addressee":"Raffaello de' Medici","text":"Then stand, and let the city judge between us — I'll not be frightened off the field by talk of swords. But mark this: a man who counts soldiers before he counts friends has already told the hall what kind of Gonfaloniere he'd be.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"insult","words":"a man who counts soldiers before he counts friends"},{"id":"L18","turn":2,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Contessa Isabella","addressee":null,"text":"You are kind, Signora Giorgia, and right — let the dead keep their rest and Florence mind her living. I would only say this: whoever would rule us should first be a man who can kneel and confess his faults before the city, for a ruler who cannot repent will not govern justly. Virtue before faction, I say.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"claim","words":"a ruler who cannot repent will not govern justly"},{"id":"L19","turn":2,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Raffaello de' Medici","addressee":null,"text":"Friends are counted by the barrel, Francesco, and I've never yet drunk alone. But come, let us not spend the whole night measuring names — the hall's small, and every man here will have to choose soon enough whose hand he trusts.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"none","words":null},{"id":"L20","turn":2,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Giorgia Pazzi","addressee":"Contessa Isabella","text":"A ruler who kneels before the city, Contessa — I would not quarrel with that, for Florence has had enough of men who kneel to no one. But tell me plainly, since you speak of virtue before faction: would you have a Gonfaloniere who confesses to the friars, or to France? For the city must choose between powers as well as men.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"pressure","words":"would you have a Gonfaloniere who confesses to the friars, or to France?"},{"id":"L21","turn":2,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Francesco Pazzi","addressee":null,"text":"Agreed — let us leave off measuring names, for the night will measure them soon enough. Only remember, Raffaello, that when the choosing comes, men trust the name that was not bought.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"insult","words":"the name that was not bought"},{"id":"L22","turn":2,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Contessa Isabella","addressee":"Giorgia Pazzi","text":"To the friars, Signora, and to God — for France buys men with pensions, and a city ruled by purchased conscience is no better than a harlot in silk. Let our Gonfaloniere kneel to heaven, not to a French purse; that is my plain answer, and I am no man's creature but God's.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"claim","words":"France buys men with pensions, and a city ruled by purchased conscience is no better than a harlot in silk"},{"id":"L23","turn":2,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Raffaello de' Medici","addressee":null,"text":"Bought or not, Francesco, the city will want a hand that can hold a sword steady when the French come knocking at our gates. But enough of names — Lupo, you've stood silent through all this. Tell me plainly what a man like you looks for in a Gonfaloniere.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"none","words":null},{"id":"L24","turn":2,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Giorgia Pazzi","addressee":null,"text":"Then we are of one mind, Contessa, for I would not see Florence ruled from a foreign purse either — let the city's honor be her own. But tell me, since you weigh men's souls so carefully: when the time comes to name our candidate, will you weigh a Pazzi's virtues as fairly as a Medici's? For I have heard too many in this city judge the name before the man.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"pressure","words":"will you weigh a Pazzi's virtues as fairly as a Medici's?"},{"id":"L25","turn":2,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Francesco Pazzi","addressee":"Raffaello de' Medici","text":"Lupo's silence is worth more than a hall of boasts, Raffaello, and he is not for a Medici's flattery. Ask the men who follow you into fire what they look for — I'd wager they look for a purse that pays on time.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"insult","words":"I'd wager they look for a purse that pays on time"},{"id":"L26","turn":2,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Captain Armand LeNoir","addressee":"Contessa Isabella","text":"A harlot in silk, Contessa? France has kept faith with Florence while friars kept their beads. Virtue is proved in a man's deeds, not in whose purse he refuses — and I have yet to see a pension bought in this hall tonight.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"insult","words":"A harlot in silk, Contessa?"},{"id":"L27","turn":2,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Raffaello de' Medici","addressee":null,"text":"A purse that pays on time — I'll grant you that's a soldier's first prayer, Francesco, and I've never let a man of mine go unpaid. Lupo, I'll ask you plainly another day, when there's less noise about. For now, drink with me and judge the purse by the man who carries it.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"claim","words":"I've never let a man of mine go unpaid"},{"id":"L28","turn":2,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Contessa Isabella","addressee":"Captain Armand LeNoir","text":"Deeds, Captain? Then let me name one small deed and be done with it — I have forgiven a young man's gaming debt to my house, and asked no thanks of him. Let France show her ledger of mercies, and I shall show mine.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"claim","words":"I have forgiven a young man's gaming debt to my house"},{"id":"L29","turn":3,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Francesco Pazzi","addressee":"Raffaello de' Medici","text":"Then let the cup stay on the table, for a Pazzi's men drink at a Pazzi's table and not at another's beckoning. Keep your purse for the men who need counting — mine know whose bread they eat.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"insult","words":"a Pazzi's men drink at a Pazzi's table"},{"id":"L30","turn":3,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Captain Armand LeNoir","addressee":"Contessa Isabella","text":"A gaming debt forgiven — then your house knows the gaming tables of Florence better than a widow's beads would suggest. I ask plainly, and I'll ask once: which of your kin kept such company, and did any of them pay a debt in silver stamped with a boar?","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"pressure","words":"which of your kin kept such company"},{"id":"L31","turn":3,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Raffaello de' Medici","addressee":null,"text":"Then keep your cup and your bread, and I'll keep mine — the piazza knows where my men drink, and it's not behind a locked door. Lupo, when the noise dies down, my table's open and the wine's already paid for.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"none","words":null},{"id":"L32","turn":3,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Contessa Isabella","addressee":"Captain Armand LeNoir","text":"The boar is my husband's arms, Captain, and every letter my bankers send bears it — ask them, if you doubt a widow. As for which kin kept gaming company, I have buried my husband and will not drag his name through a soldier's questions. If you have a charge, name it plainly before witnesses.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"pressure","words":"If you have a charge, name it plainly before witnesses."},{"id":"L33","turn":3,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Francesco Pazzi","addressee":null,"text":"Then the piazza may drink to your health, and mine will drink to the Pazzi name — in a house with no lock and no need of one. Lupo's silence is his own, Raffaello, and I'll not have him pressed for it at another man's table.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"claim","words":"I'll not have him pressed for it"},{"id":"L34","turn":3,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Captain Armand LeNoir","addressee":"Contessa Isabella","text":"Then hear my charge plainly, before God and these witnesses: seven years past, a hired blade killed a friend of mine in the north chapel of San Frediano, and a silver boar was found there after. If your house's arms are on it, say so now — and say who of your blood might have paid for a killing.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"pressure","words":"say who of your blood might have paid for a killing"},{"id":"L35","turn":3,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Francesco Pazzi","addressee":null,"text":"Enough, then — the cup's closed and the table's closed, and no man here need say another word of it. The night will choose soon enough, and I'd have the choosing done in daylight, not over a Medici's wine. Lupo, we've said our piece; let the hall remember who spoke last and who spoke plain.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"none","words":null},{"id":"L36","turn":3,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Contessa Isabella","addressee":"Captain Armand LeNoir","text":"A charge, Captain, must rest on more than a trinket found in a chapel — for a boar is stamped on half the letters in Florence, and any thief may drop what he stole. I say plainly: I had no part in any hired blade, and I will not be tried by your suspicions in another woman's hall. Bring proof, or bring silence.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"denial","words":"I had no part in any hired blade"},{"id":"L37","turn":3,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Raffaello de' Medici","addressee":null,"text":"Plain enough, and spoken last — I'll not quarrel with a closed door. The hall can remember what it likes; when the choosing comes, I'll be standing in the open where every man can see me, and that's all the plain speech I need.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"none","words":null},{"id":"L38","turn":3,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Giorgia Pazzi","addressee":null,"text":"Contessa, you have answered like a woman of honor, and a trinket proves nothing against a house. Captain, the graves of San Frediano are not the business of this hall tonight — Florence must choose a Gonfaloniere, and I would rather count virtues than old wounds. Let us speak of who can govern, not who can accuse.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"claim","words":"a trinket proves nothing against a house"},{"id":"L39","turn":3,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Francesco Pazzi","addressee":null,"text":"Then stand in the open, Raffaello, and let the piazza see what it costs to keep you there. My Florins stay in my purse and my men at my side, and the ballot will say which of us the city trusts.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"claim","words":"the ballot will say which of us the city trusts"},{"id":"L40","turn":3,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Contessa Isabella","addressee":"Giorgia Pazzi","text":"You speak as a woman of sense, Signora, and I thank you for it — an old grave will not fill Florence's seat of government. Let us speak of who can kneel before this city and rise a better ruler for it, and let the captain keep his trinkets for the magistrate.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"none","words":null},{"id":"L41","turn":3,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"notaio","speaker":null,"addressee":null,"text":"Raffaello de' Medici drew Captain Armand LeNoir aside from company — a private word, where none could hear.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},{"id":"L42","turn":3,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"notaio","speaker":null,"addressee":null,"text":"Raffaello de' Medici drew Captain Armand LeNoir aside from company — a private word, where none could hear.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]}],"thoughts":[{"id":"T1","turn":0,"character":"Contessa Isabella","call":"plan","text":"I am seated beside the very man whose brother I had killed, and he does not know it. Every word I say to Captain Armand LeNoir must be measured, warm but never intimate enough to invite questions about his family or his past. Giorgia Pazzi is a useful third presence — she keeps the talk public and spares me a private word with the captain so early.","after_line":"L4"},{"id":"T2","turn":0,"character":"Raffaello de' Medici","call":"plan","text":"Francesco Pazzi stands before me with Lupo at his side — my family's enemy, and yet a man whose respect I might turn to use. I must play the cavalier, all ease and charm, and give nothing away of my debt or my ambitions. What matters most is that I keep my secrets and begin to sound out who tonight can be of use to me.","after_line":"L2"},{"id":"T3","turn":0,"character":"Giorgia Pazzi","call":"plan","text":"The gathering is smaller than I expected — Emile is elsewhere tonight, which means I must find a way to reach him, or wait until he can be reached. For now I am seated beside Armand, which is both a delight and a danger: Contessa Isabella is watching, and every glance between us is evidence. Francesco will want me as a pawn in his schemes; I intend to be the hand that moves the pieces instead.","after_line":"L4"},{"id":"T4","turn":0,"character":"Captain Armand LeNoir","call":"plan","text":"I am seated between the two women who could save or undo me: Giorgia, whom I love and must not betray with a glance, and Contessa Isabella, the Dominican widow whose eyes followed me at Mass. The Contessa is the friars' friend — if she suspects my affair or my purpose here, she can ruin Giorgia's name and mine. I must be courteous and watchful, learn what the Contessa knows of San Frediano, and keep my mouth sealed on Giorgia.","after_line":"L4"},{"id":"T5","turn":0,"character":"Francesco Pazzi","call":"plan","text":"The gathering is small — only six of us in this palazzo tonight, and already I am seated with a Medici. Raffaello is young and vain; there is no better place to begin turning the city against his house than in his own hearing, and no safer place to be seen doing it than beside my silent Lupo. But I must watch my tongue: Clarice is elsewhere tonight, and any word of her would be ruin.","after_line":"L2"},{"id":"T6","turn":0,"character":"Lupo","call":"plan","text":"A small gathering — six of us, and only two Pazzi in the room. Francesco is beside me, which is where I belong, but the coin in my purse is not enough to buy my way out of the debt that follows me. Raffaello de' Medici stands here too, a gambler with a soldier's swagger, and if any Medici lives on French gold it is him. I must be paid before the Murder Round, and I will not take a Pazzi's blood for it — but a Medici's coin spends as well as any.","after_line":"L2"},{"id":"T7","turn":1,"character":"Lupo","call":"think","text":"Raffaello and Francesco in one small circle — a Medici and a Pazzi, and me between them. Raffaello's a soldier who plays at dice; if he's borrowed French money, he'll boast of it before he'll hide it. I'll let Francesco talk and watch where the gambler's eyes go when France is named.","after_line":"L2","conversation":"C1","took":"none","took_target":"none","target_line":null,"words":null},{"id":"T8","turn":1,"character":"Raffaello de' Medici","call":"think","text":"Francesco Pazzi and Lupo, and the notary has already paired me with my enemy's kin — no accident, that. I'll play the golden cavalier, all ease and charm, and let Francesco do the talking while I read what he wants. I give nothing of my debt or LeNoir's flattery; I take his measure first.","after_line":"L2","conversation":"C1","took":"none","took_target":"none","target_line":null,"words":null},{"id":"T9","turn":1,"character":"Francesco Pazzi","call":"think","text":"So the palace is nearly empty tonight — six of us, and the great names of both houses absent. That suits me: fewer witnesses, and Raffaello here with only my silent Lupo to hear what passes between us. I will flatter the boy first, let him preen, then slip the needle in about Medici gold propping up hollow men. I have told no one anything yet, so my story is clean; I must keep it so, and keep my heart out of my mouth where Clarice is concerned.","after_line":"L2","conversation":"C1","took":"none","took_target":"none","target_line":null,"words":null},{"id":"T10","turn":1,"character":"Lupo","call":"think","text":"Francesco's thrown a stone at a Medici's purse in front of me — good. If Raffaello's blood is up, he'll answer with a boast, and a gambler's boast is where the moneylender's name slips out. I'll hold my tongue and watch his hands and his eyes when France is near the talk; a soldier's pride outs him faster than any question of mine.","after_line":"L5","conversation":"C1","took":"insult","took_target":"other","target_line":"L5","words":"when a name is held up by nothing but ledgers and loans"},{"id":"T11","turn":1,"character":"Raffaello de' Medici","call":"think","text":"Francesco's barb about ledgers and creditors cuts closer to the bone than he can know — he's fishing, or he's heard a rumor. I won't flinch; a gambler never shows his hand at the first raise. I'll laugh it off and turn the blade back on the Pazzi's own thin purse, all warmth and swagger. Let him see a cavalier, not a debtor.","after_line":"L5","conversation":"C1","took":"insult","took_target":"other","target_line":"L5","words":"when a name is held up by nothing but ledgers and loans, how long does it stand"},{"id":"T12","turn":1,"character":"Francesco Pazzi","call":"think","text":"I've opened with a barb and let it hang in the air — now I must watch Raffaello's face, not his words. If he bristles, he proves the boy is thin-skinned and his house brittle; if he laughs it off, he's shrewder than I took him for. Either way, Lupo stands at my shoulder and the room is small, so I can afford one more turn of the knife before I let him speak. I've told no lies yet tonight, only needled — my story stays clean.","after_line":"L5","conversation":"C1","took":"insult","took_target":"none","target_line":null,"words":null,"words_log":{"fallback":"no line","raw":"when a name is held up by nothing but ledgers and loans, how long does it stand once the creditors grow tired of propping it?"}},{"id":"T13","turn":1,"character":"Giorgia Pazzi","call":"think","text":"So the notary has named the whole guest list aloud, and Emile is not among us tonight — my prize is out of reach for now, which means the marriage must wait and the election must come first. I am seated between Armand and Contessa Isabella, and that is precisely the arrangement I must manage: warmth for the Contessa, cool courtesy for Armand, nothing that reads as intimacy. Let the Contessa believe I am merely a Pazzi daughter being charming; her leanings are worth testing before Francesco starts spending Florins as if they were his own.","after_line":"L4","conversation":"C2","took":"none","took_target":"none","target_line":null,"words":null},{"id":"T14","turn":1,"character":"Contessa Isabella","call":"think","text":"The notary has merely seated us — no one has said a word yet, and I must not be the one to rush into speech beside LeNoir. Let Giorgia carry the opening; a widow's first words should be gentle and unhurried, asking after the evening's business rather than probing a soldier's past. Every calm word I spend now is a coin in the bank against suspicion later.","after_line":"L4","conversation":"C2","took":"none","took_target":"none","target_line":null,"words":null},{"id":"T15","turn":1,"character":"Captain Armand LeNoir","call":"think","text":"So the Prince and the Ambassador are both elsewhere tonight, beyond reach — that leaves me the Embassy's only hand in this room, and its safety rests on my wits. Giorgia sits near enough that I feel her, and I dare not look at her too long; the Contessa has a widow's stillness and a priest's patience, and she is watching. I will speak to the Contessa first — courteous, soldierly — and turn the talk toward San Frediano and its chapel, letting her think I am merely pious.","after_line":"L4","conversation":"C2","took":"none","took_target":"none","target_line":null,"words":null},{"id":"T16","turn":1,"character":"Contessa Isabella","call":"think","text":"He has laid San Frediano at my feet in the first breath of the evening — as a question, not an accusation, yet my heart is a hammer. He says he never learned what became of it, so he does not know; but if I flinch or over-explain, I will teach him where to look. I must answer as a pious widow would, mildly, with the friars' language of penance and unsolved sin, and turn him gently elsewhere without seeming to.","after_line":"L6","conversation":"C2","took":"claim","took_target":"other","target_line":"L6","words":"I knew a man killed there years ago, and I have never learned what became of the matter."},{"id":"T17","turn":1,"character":"Captain Armand LeNoir","call":"think","text":"I've cast the line and now I wait to see if the Contessa bites or turns it back on me. My question was blunt enough to sound like a soldier's grievance, which is what I want — a man mourning an old friend, nothing more. But the widow has a priest's patience, and if she knows anything of that night she'll measure her words carefully. I must watch her face more than her tongue, and I dare not so much as glance at Giorgia while I do it.","after_line":"L6","conversation":"C2","took":"none","took_target":"none","target_line":null,"words":null},{"id":"T18","turn":1,"character":"Giorgia Pazzi","call":"think","text":"Armand is being clever — asking the Contessa about the friars and San Frediano is a way to probe her Church leanings without seeming to, and it keeps his eyes off me. Good. But it also hands her the floor, and I want to know where Contessa Isabella's loyalties lie before Francesco starts flinging Florins about. I'll let her answer, then turn the talk toward the election and see what she wants.","after_line":"L6","conversation":"C2","took":"none","took_target":"other","target_line":"L6","words":null},{"id":"T19","turn":1,"character":"Lupo","call":"think","text":"Raffaello's dodged Francesco's blade neatly and turned it back with a question — a soldier's parry, not a confession. He says nothing of France, nothing of debts, only 'credit' and 'coppers,' which tells me he's careful with his purse-talk in company. I'll hold my tongue a beat longer; let Francesco press him, and watch whether the gambler's hand goes to his doublet or his eyes drift when the talk turns to who actually holds his markers.","after_line":"L7","conversation":"C1","took":"none","took_target":"other","target_line":"L7","words":null},{"id":"T20","turn":1,"character":"Francesco Pazzi","call":"think","text":"Raffaello parried well — turning my needle about thin purses back on the Pazzi, and then asking plainly what I want tonight. That question is a probe, not courtesy; he is fishing for my ambitions to carry back to his kin. I must answer with pride and evasion, not confession — let him see a Pazzi who wants honour restored, nothing he can use. Lupo's silence at my shoulder is my only comfort here; I've told no untruth yet, and I mean to keep it that way.","after_line":"L7","conversation":"C1","took":"pressure","took_target":"other","target_line":"L7","words":"So tell me, what does a Pazzi truly want tonight?"},{"id":"T21","turn":1,"character":"Raffaello de' Medici","call":"think","text":"Francesco's jab about creditors is a probe — he's either heard a rumor of my debt or he's simply needling the family name, and I can't tell which. I've laughed it off and turned it on the Pazzi purse, which is the right swagger, but now I've asked him plainly what he wants tonight — I should listen hard for the answer rather than fill the silence myself. If he names a price or a deal, that tells me he's buying; if he only sneers, he's posturing for Lupo's benefit.","after_line":"L7","conversation":"C1","took":"insult","took_target":"other","target_line":"L5","target_answering":true,"words":"when a name is held up by nothing but ledgers and loans, how long does it stand"},{"id":"T22","turn":1,"character":"Contessa Isabella","call":"think","text":"He did not answer my question about kin — he let it hang, and now he waits to see what I do with it. That silence could be grief, or it could be a soldier testing where the ground is soft. I must not press him again; a second question about the dead man would look like hunger for the answer, and I should let Giorgia fill the space if she will. If he names the man as his brother, I must receive it with plain, sober pity — nothing more.","after_line":"L8","conversation":"C2","took":"claim","took_target":"other","target_line":"L6","target_answering":true,"words":"I knew a man killed there years ago, and I have never learned what became of the matter."},{"id":"T23","turn":1,"character":"Captain Armand LeNoir","call":"think","text":"She turns my question back on me like a confessor's blade — 'was he kin to you?' If I deny it flatly she'll smell the lie, and if I own it she'll press me for the whole story before Giorgia. A soldier's grief is no shame, so I'll give her a half-truth: a friend of my youth, nothing more, and turn the friars' talk back toward the chapel and who was seen there. I must not look at Giorgia, though I feel her eyes on me now.","after_line":"L8","conversation":"C2","took":"pressure","took_target":"other","target_line":"L8","words":"was he kin to you, that the matter should still weigh on your soul?"},{"id":"T24","turn":1,"character":"Giorgia Pazzi","call":"think","text":"Isabella is no fool — she has turned Armand's probing question back on him and asked whether the dead man was kin. That is a hunter's question dressed as a shepherd's kindness, and if Armand answers carelessly she may pull a thread that leads somewhere I cannot afford. I must watch his face as closely as hers, and be ready to turn the talk to lighter ground before she draws blood. She has shown me she is shrewd and pious; she has claimed nothing of her politics yet, and that is what I still need.","after_line":"L8","conversation":"C2","took":"pressure","took_target":"other","target_line":"L8","words":"was he kin to you, that the matter should still weigh on your soul?"},{"id":"T25","turn":1,"character":"Lupo","call":"think","text":"Francesco's pressing him hard on the ledger-talk, and Raffaello keeps parrying with pride instead of numbers. A man who answers 'credit' twice and never once names a lender is either clean or careful — and careful is the more interesting of the two. I'll stay a stone at Francesco's shoulder and watch the gambler's hands; if French gold sits in his purse, his fingers will find it before his tongue does.","after_line":"L9","conversation":"C1","took":"pressure","took_target":"other","target_line":"L9","words":"is there a Medici in this hall worth the name, or only ledgers?"},{"id":"T26","turn":1,"character":"Francesco Pazzi","call":"think","text":"Raffaello turned my needle back on me — 'counting coppers since your grandfather's day' — and now demands to know what a Pazzi wants. That is a probe, and a clever one: he means to carry my answer to his kin. He has shown me he is quicker than I judged, and that he will not be shamed into silence. I will answer with pride and evasion — honour restored, nothing he can use — and keep my Florins and my heart where they are. I have told no untruth tonight, only needled, and I mean to keep it so.","after_line":"L9","conversation":"C1","took":"pressure","took_target":"other","target_line":"L7","target_answering":true,"words":"So tell me, what does a Pazzi truly want tonight?"},{"id":"T27","turn":1,"character":"Raffaello de' Medici","call":"think","text":"Francesco is calling my family thin and asking whether any Medici here is worth the name — that's a challenge to my face, in front of Lupo, and it's aimed at Piero as much as me. Here's my opening: I can answer as the soldier, the man of the piazza, not the ledger-keeper — let him see a Medici with a sword arm and a purse that doesn't flinch. I've boasted of credit already; I must not repeat it, or I'll look hollow. Turn it back on him with steel and warmth, and let him wonder which Medici I mean.","after_line":"L9","conversation":"C1","took":"insult","took_target":"other","target_line":"L9","words":"is there a Medici in this hall worth the name, or only ledgers?"},{"id":"T28","turn":1,"character":"Contessa Isabella","call":"think","text":"He calls the dead man a friend of his youth and presses me for who was seen near the north chapel — a soldier's question dressed as a mourner's. He does not know it was I, or he would not ask so plainly; but every name I offer or refuse will be weighed. I must answer with the friars' language, admit no knowledge of that night, and turn him toward penance rather than witnesses — and let Giorgia's presence keep this from becoming an interrogation.","after_line":"L10","conversation":"C2","took":"pressure","took_target":"other","target_line":"L10","words":"who was seen near the north chapel in those days?"},{"id":"T29","turn":1,"character":"Captain Armand LeNoir","call":"think","text":"She has not answered me at all — she has turned the question back like a confessor testing a penitent, and she is watching to see how hard I press. If I press too hard on the north chapel, a Dominican widow will begin to wonder why a French captain cares so much for a Florentine back-alley killing. I have said he was a friend of my youth; I must keep to that story and let her come to the chapel in her own time. One more careful question, and then I let her speak.","after_line":"L10","conversation":"C2","took":"none","took_target":"other","target_line":"L8","target_answering":true,"words":null},{"id":"T30","turn":1,"character":"Giorgia Pazzi","call":"think","text":"Armand is pushing too hard on San Frediano — a dead friend, a north chapel, and now he asks her to name names. That is not grief, that is an interrogation, and Contessa Isabella is sharp enough to hear it too. If she presses him further he may say something reckless, and I cannot afford to be seen as the woman who sat smiling while a French captain dredged up old blood. I should step in now, smooth the ground, and turn the talk toward the election before this becomes a scene.","after_line":"L10","conversation":"C2","took":"pressure","took_target":"other","target_line":"L10","words":"Tell me, Contessa, who was seen near the north chapel in those days?"},{"id":"T31","turn":1,"character":"Lupo","call":"think","text":"Raffaello's turned the whole thing to soldiering and the piazza — pride, not proof. He's never named a lender, never named a sum, and a man on French gold would be sweating by now with Francesco prodding him. I'll not speak yet; let Francesco swing again and watch whether the gambler's hand drifts to his purse when the talk comes round to who holds his markers.","after_line":"L11","conversation":"C1","took":"claim","took_target":"other","target_line":"L11","words":"I've stood in the piazza with soldiers who'd follow me into fire"},{"id":"T32","turn":1,"character":"Raffaello de' Medici","call":"think","text":"Francesco won't take my boast as proof — he'll demand substance, or worse, he'll name Piero and force me to either defend my brother or cut him. Lupo's silent, watching, and whatever I say here will be carried. I want to keep the swagger but give Francesco something concrete enough that he can't dismiss me as hollow, without committing to anything that binds me.","after_line":"L11","conversation":"C1","took":"insult","took_target":"other","target_line":"L9","target_answering":true,"words":"is there a Medici in this hall worth the name, or only ledgers?"},{"id":"T33","turn":1,"character":"Francesco Pazzi","call":"think","text":"He boasts of soldiers who'd follow him into fire — a claim, not proof, and a loud one. But it is a claim that smells faintly of threat, as if he means me to know he is not alone and not afraid. I want to answer with a Pazzi who fears no piazza and no soldier, but I must not let pride drag me into a duel of boasts where he has the larger purse. Better to laugh at the soldier's tale and turn it — let him see I am not moved, and let Lupo's silence speak for me.","after_line":"L11","conversation":"C1","took":"claim","took_target":"other","target_line":"L11","words":"soldiers who'd follow me into fire"},{"id":"T34","turn":1,"character":"Contessa Isabella","call":"think","text":"He has named the north chapel and asked me to name who was seen there — that is a soldier narrowing a field, not a mourner grieving. I said I kept to my house and my beads, and that story must hold now: no flicker, no helpful speculation, no second guess at his silence about kin. I want Giorgia to fill this silence, or the talk to turn to the election and the friars' cause, before he finds another angle on that night.","after_line":"L12","conversation":"C2","took":"pressure","took_target":"other","target_line":"L10","target_answering":true,"words":"who was seen near the north chapel in those days?"},{"id":"T35","turn":1,"character":"Captain Armand LeNoir","call":"think","text":"She has given me nothing but a widow's piety and a mild rebuke — no name, no guess, and she says plainly she will not guess. Pressing her again before Giorgia would make me look like a man hunting a grudge rather than mourning a friend, and a Dominican widow's suspicion is the last thing I need. Better to let it rest, thank her for her counsel, and turn to Raffaello later, where the seal can be read by a soldier's eye. I will keep my story straight: a friend of my youth, no more.","after_line":"L12","conversation":"C2","took":"denial","took_target":"other","target_line":"L12","words":"I can name no one honestly, and I will not guess where a man's life is at stake"},{"id":"T36","turn":1,"character":"Giorgia Pazzi","call":"think","text":"Isabella has shut the door on Armand's probing with widow's piety — a graceful refusal, and a warning that she will not be dragged into naming names. That is to my advantage: the sooner this talk of San Frediano dies, the less anyone looks at Armand and me together. Now I step in as the peacemaker, praise her discretion, and turn the company toward the election — where I can learn what she wants and what she might be worth. Let her see a charming Pazzi daughter, not a woman with anything to hide.","after_line":"L12","conversation":"C2","took":"denial","took_target":"other","target_line":"L12","words":"I can name no one honestly, and I will not guess where a man's life is at stake"},{"id":"T37","turn":1,"character":"Raffaello de' Medici","call":"think","text":"Francesco's just declared he wants the staff himself — that's a Pazzi announcing he'll stand as candidate, and he's dismissed me as a man who merely inherited his name. That stings because it's half true, and Lupo is watching to see whether I fold. I can't out-argue him on 'earned' — I have to show I'm a man of action, not a ledger, and plant the notion that the staff could rest in my hand rather than Piero's.","after_line":"L13","conversation":"C1","took":"threat","took_target":"other","target_line":"L13","words":"I want the staff in my own hand"},{"id":"T38","turn":1,"character":"Lupo","call":"think","text":"Francesco's swinging like a drunk with a blade — all pride and no edge, and every swing tells Raffaello exactly where the Pazzi hurt. The Medici soldier still hasn't named a lender or a sum, and I've watched his hands the whole while; they stay off his purse. So he's either clean or too clever to show it, and pressing him harder in open company only makes Francesco look the bully. I'll hold my tongue and keep my place at his shoulder — the coin I need won't come from a boast, it'll come from someone with a reason to want a quiet word.","after_line":"L13","conversation":"C1","took":"none","took_target":"other","target_line":"L13","words":null},{"id":"T39","turn":1,"character":"Francesco Pazzi","call":"think","text":"He has turned my own boast back on me — 'earned his name' against 'inherited it' — and he is clever enough to know that arrow flies both ways, for every Pazzi name is inherited too. But he has also let slip that he stands in a borrowed hall, which is to say he is a guest here as much as I, not the master of it; that is worth remembering. I want to press that advantage lightly and let him feel the room's eyes, without spending a Florin or a secret. I have told no untruth tonight — only needled — and I mean to keep it so; Lupo's silence behind me is my one sure card.","after_line":"L13","conversation":"C1","took":"insult","took_target":"other","target_line":"L11","target_answering":true,"words":null,"words_log":{"wrong_line":"L13","raw":"one who's merely inherited it"}},{"id":"T40","turn":1,"character":"Giorgia Pazzi","call":"think","text":"Armand has pulled back before Isabella could draw blood — 'let us speak of lighter things' is a retreat dressed as courtesy, and a wise one. He has revealed more than he knows: a dead friend, a debt he will not let lie, and a temper that surfaces when the Church is named. Isabella has closed her door and shown herself shrewd and pious, but she has claimed nothing of her politics. I want to be the one who turns this to the election now, and to learn what she wants before Francesco starts buying men with Florins.","after_line":"L14","conversation":"C2","took":"none","took_target":"other","target_line":"L14","words":null},{"id":"T41","turn":1,"character":"Contessa Isabella","call":"think","text":"He has let it go — 'lighter things,' he says — but 'God knows I have not' is a soldier's way of saying the account is still open, and he has marked me as a woman who would not name anyone. That is not proof of guilt, only of caution, yet I must not let him dwell. I want the talk turned to the election and the friars' cause, and I want Giorgia speaking, so that this company forgets San Frediano before the next round.","after_line":"L14","conversation":"C2","took":"threat","took_target":"other","target_line":"L14","words":"God, who saw that night, knows I have not"},{"id":"T42","turn":1,"character":"Captain Armand LeNoir","call":"think","text":"The widow gives me nothing but piety and a closed door — she claims she kept to her house and beads, and I cannot call that a lie, only a wall. I have said my friend was a friend of my youth, and I must keep to that story now; pressing a Dominican widow before Giorgia would only make her wonder why a French captain hunts a Florentine killing. Better to turn to lighter talk as I promised, and save the seal for Raffaello's soldier's eye. But God knows I have not forgotten, whatever the company hears.","after_line":"L14","conversation":"C2","took":"denial","took_target":"other","target_line":"L12","target_answering":true,"words":"I can name no one honestly, and I will not guess where a man's life is at stake"},{"id":"T43","turn":1,"character":"Raffaello de' Medici","call":"think","text":"Francesco has now said plainly he wants the staff in his own hand — that's a claim of candidacy, not proof he'll get it, and he's dared me to earn mine. I've just declared I'll stand myself, which is a bold stroke in front of Lupo; now I must make it sound like a soldier's confidence rather than a boy's bluff, without naming Piero or cutting him openly. What I want is to plant in Lupo's ear that there's a Medici here worth following — me — and to leave Francesco wondering whether the Pazzi purse can match a Medici's swords. I've boasted of soldiers and credit; I must not repeat either, or I'll look hollow.","after_line":"L15","conversation":"C1","took":"claim","took_target":"other","target_line":"L13","target_answering":true,"words":"I want the staff in my own hand"},{"id":"T44","turn":1,"character":"Lupo","call":"think","text":"Raffaello's thrown his own name into the ring — that's a claim of standing, not proof of anything, and it tells me he wants the chair for himself, which makes him the man to watch and the man worth knowing. He still hasn't named a lender or a sum, and his hands have stayed off his purse the whole while; clean or careful, I can't yet say. Francesco will rise to the bait like a trout, and that's fine — let him swing. My coin won't come from this boasting; it'll come from someone who wants a quiet blade, and I keep my place and my tongue.","after_line":"L15","conversation":"C1","took":"claim","took_target":"other","target_line":"L15","words":"I'll stand for the staff myself, Francesco"},{"id":"T45","turn":1,"character":"Francesco Pazzi","call":"think","text":"He has just declared himself a candidate for the staff — openly, to my face, in a hall where the Notaio hears every word. That is not a boast now but a gauntlet thrown; he means to make this a contest of Medici against Pazzi before the city. I want to answer with a Pazzi who does not flinch, but I must be careful: if I match his declaration too hotly, I hand him proof of my own ambition to carry to his kin. Better to receive it coolly, as if a rival's candidacy were the most natural thing in the world, and let him wonder what I have planned. I have told no untruth tonight — only needled — and I mean to keep it so.","after_line":"L15","conversation":"C1","took":"pressure","took_target":"other","target_line":"L15","words":"I'll stand for the staff myself, Francesco, and we'll see which name the city reaches for"},{"id":"T46","turn":1,"character":"Giorgia Pazzi","call":"think","text":"Armand has retreated cleanly and given me the opening I wanted — the dead are buried and the talk is mine to turn. Now I must make Isabella show her hand on the election without seeming to interrogate her; a compliment, a light question, and let her talk. I told her discretion is a rare jewel — no untruth in that, and it costs nothing. To the room I am merely the charming Pazzi daughter who dislikes gloomy talk, which is exactly the mask I want worn tonight.","after_line":"L16","conversation":"C2","took":"none","took_target":"other","target_line":"L14","target_answering":true,"words":null},{"id":"T47","turn":1,"character":"Captain Armand LeNoir","call":"think","text":"Giorgia has turned the talk away from old graves with a grace that is almost a warning — she knows I hunt something, and she would have me look to the living. She is right that the city chooses soon, and a captain of the French guard should be seen to care for that, not for a Florentine killing. I have told the Contessa only that Lucien was a friend of my youth; that story stands, and I will not look too long at Giorgia. Yet her words are also a door held open to speak with her, and I would take it before the night grows dangerous.","after_line":"L16","conversation":"C2","took":"none","took_target":"other","target_line":"L16","words":null},{"id":"T48","turn":1,"character":"Contessa Isabella","call":"think","text":"Giorgia has done me a kindness — she called my silence discretion and turned the Captain toward the election, and I should reward that by taking her cue gladly. If the talk runs to the Gonfaloniere, I can speak of Florence's need for a virtuous ruler and let the friars' cause be heard without seeming to campaign. I told LeNoir I kept to my house and my beads in those years and could name no one — that story must stay fixed, and I will not glance at him again tonight if I can help it. My behavior looks like a pious widow's caution, which is exactly what I want it to look like.","after_line":"L16","conversation":"C2","took":"none","took_target":"other","target_line":"L16","words":null},{"id":"T49","turn":1,"character":"Giorgia Pazzi","call":"move","text":"I need to be seen as the charming Pazzi daughter, not a woman with secrets, so I will stay in this Capannello and let Isabella's discretion cool the air. But I must learn her politics before Francesco buys her — a light question, an open ear, and I can measure what she is worth. Armand I will not draw aside now; two withdrawals in a night would be a beacon, and I have no wish to be the woman Il Notaio names twice.","after_line":"L16"},{"id":"T50","turn":2,"character":"Raffaello de' Medici","call":"think","text":"Francesco's turned my soldier's boast into a warning about counting soldiers before friends — clever, and it lands because Lupo's standing right here hearing it. He's declared his candidacy openly and dared me to match it; I've already said I'll stand, so the field is drawn. What I need now is to make the hall hear me as the man who counts friends too — and to plant in Lupo's ear that a Medici with swords and allies beats a Pazzi with grievances. I must not overplay it; one more sharp answer, then let the room turn.","after_line":"L17","conversation":"C1","took":"insult","took_target":"other","target_line":"L17","words":"a man who counts soldiers before he counts friends has already told the hall what kind of Gonfaloniere he'd be"},{"id":"T51","turn":2,"character":"Francesco Pazzi","call":"think","text":"He has named me plainly as his rival and dressed it as a challenge to swords — 'when swords are counted and not ledgers' — and that is a threat wrapped in a boast, meant to make the hall see a soldier and a clerk. I answered well enough, but I must not let him turn this into a contest of steel where he has the advantage; my weapon is the city's judgment and my name's cause, not his fire. Let him hear that a Gonfaloniere wins friends, not fear, and let the Notaio's record show I did not flinch and did not threaten. I have told no untruth tonight — only needled — and I mean to keep it so, with Lupo's silence behind me.","after_line":"L17","conversation":"C1","took":"threat","took_target":"other","target_line":"L15","target_answering":true,"words":"when swords are counted and not ledgers"},{"id":"T52","turn":2,"character":"Lupo","call":"think","text":"Francesco's drawing a line under it — swords counted, not ledgers — and he's said it plainly enough that the hall will remember it. Raffaello's still all pride and no lender's name; if French gold sits in his purse, he's too careful to let it show, and pressing him in open company only makes my master look the bully. I keep my place and my tongue; the coin I need comes from a client, not a boast. Nothing I've said tonight needs mending — I've said nothing at all.","after_line":"L17","conversation":"C1","took":"claim","took_target":"other","target_line":"L17","words":"a man who counts soldiers before he counts friends has already told the hall"},{"id":"T53","turn":2,"character":"Contessa Isabella","call":"think","text":"Giorgia has smoothed the waters and even praised my discretion — a kindness I should repay by taking her cue toward the election. My line about a ruler who can kneel and confess has planted the friars' cause in the open; now I want to see whether Francesco, when I find him, will bend toward repentance, and I want Giorgia as an ally rather than a watcher. LeNoir's 'lighter things' is a soldier's retreat, not a surrender, but the room's eyes are on the election now, and I must keep my story fixed: a mourning widow, house and beads, no names.","after_line":"L18","conversation":"C2","took":"none","took_target":"other","target_line":"L16","target_answering":true,"words":null},{"id":"T54","turn":2,"character":"Giorgia Pazzi","call":"think","text":"Isabella has just declared for repentance and virtue over faction — 'a ruler who cannot repent will not govern justly' — which is Dominican doctrine dressed as piety, and it is a dagger aimed at any Pazzi candidate who stays unrepentant. She has shown her hand more than she knows: she is either a Dominican sympathizer or angling for their favor, and either way she is worth less to me than I hoped and more dangerous than I thought. I must not argue with her openly — that would make me her enemy and brand me the godless Pazzi — so I will praise her piety while gently steering to what Florence actually needs in a Gonfaloniere, and quietly test whether her virtue has a price. Armand stays in the corner of my eye; I have said nothing untrue to either of them tonight.","after_line":"L18","conversation":"C2","took":"claim","took_target":"other","target_line":"L18","words":"whoever would rule us should first be a man who can kneel and confess his faults before the city"},{"id":"T55","turn":2,"character":"Captain Armand LeNoir","call":"think","text":"The widow preaches repentance like a Dominican should — 'a ruler who cannot repent will not govern justly' — and that is exactly the poison I must keep out of this election, for a repentant candidate hands Florence to the friars. She has given me nothing on San Frediano but a wall of piety, and I will not press her again before Giorgia; my story stands, Lucien a friend of my youth. But her sermon deserves an answer from a French soldier, and it lets me be seen caring for the city's choice rather than for old graves. I will answer her mildly and turn the talk toward who can govern — and whether a man need kneel to friars to rule well.","after_line":"L18","conversation":"C2","took":"claim","took_target":"other","target_line":"L18","words":"a ruler who cannot repent will not govern justly"},{"id":"T56","turn":2,"character":"Lupo","call":"think","text":"Raffaello's turned it smooth now — 'friends are counted by the barrel' — a peace offer with a knife behind it, and he's inviting the hall to pick sides soon. He's still named no lender and no sum, so the French gold is either not there or buried deep; either way, open company won't dig it up. I keep my place at Francesco's shoulder and say nothing — my coin comes from a quiet word, not this fencing. Let them measure names; I measure purses.","after_line":"L19","conversation":"C1","took":"claim","took_target":"other","target_line":"L19","words":"I've never yet drunk alone"},{"id":"T57","turn":2,"character":"Raffaello de' Medici","call":"think","text":"Francesco's turned my own words into a sermon about friends and barrels, and Lupo's heard every bit of it — he's framing me as the soldier who drinks and boasts, while he plays the sober man of substance. I've said I'll stand, and I've said it in front of a witness, so that's a claim I now have to make good on; but the more I fence with Francesco, the more I look like a brawler rather than a candidate. Better to let this round of words rest and turn my charm on Lupo himself, quietly, before Francesco wins his ear entirely.","after_line":"L19","conversation":"C1","took":"insult","took_target":"other","target_line":"L17","target_answering":true,"words":"a man who counts soldiers before he counts friends has already told the hall what kind of Gonfaloniere he'd be"},{"id":"T58","turn":2,"character":"Francesco Pazzi","call":"think","text":"He has stepped back from the duel of boasts and offered the hall a truce — 'let us not spend the whole night measuring names' — which is a clever retreat dressed as good manners, and it tells me he felt the room cool on him. He claims friends 'counted by the barrel,' but a claim of friends is no proof of them, and I have seen him drink alone with me and my bodyguard all night. I want to close this Capannello with the last word that sounds gracious and leaves the sting in: agree, and remind the hall that when the choosing comes, men trust the name that was not bought.","after_line":"L19","conversation":"C1","took":"claim","took_target":"other","target_line":"L19","words":"Friends are counted by the barrel, Francesco, and I've never yet drunk alone."},{"id":"T59","turn":2,"character":"Giorgia Pazzi","call":"think","text":"I have just thrown a spear disguised as a question — confess to the friars, or to France — and now I wait to see which way she flinches. If she names the friars first and France with contempt, she is the Dominicans' creature and no use to me; if she hedges, her virtue has a price I might yet meet. Armand watches from the corner, and my mask must hold: the charming Pazzi daughter, curious about the city, nothing more.","after_line":"L20","conversation":"C2","took":"none","took_target":"other","target_line":"L18","target_answering":true,"words":null},{"id":"T60","turn":2,"character":"Contessa Isabella","call":"think","text":"Giorgia has put the question squarely to me — friars or France — and she is watching to see which way a penitent widow leans. I must answer as piety demands, and answer so that no one can later say I courted French coin: the friars, plainly, and virtue above foreign gold. Yet I should not sound like a zealot campaigning, only a widow who has weighed both and chosen God. She has been kind twice now; I will answer her warmly and let her see I am no one's creature.","after_line":"L20","conversation":"C2","took":"pressure","took_target":"other","target_line":"L20","words":"would you have a Gonfaloniere who confesses to the friars, or to France?"},{"id":"T61","turn":2,"character":"Captain Armand LeNoir","call":"think","text":"Giorgia has turned the widow's sermon neatly to France — she is testing Isabella, and perhaps testing me too, to hear how a French captain answers for his master's coin. If the Contessa names France as a power men kneel to, I must answer as a soldier of France without seeming to buy the city's soul; and I must not let her piety harden into a cry for a repentant candidate, for that would hand Florence to the friars. My story stands: Lucien was a friend of my youth, no more. I will speak for a ruler who is honest with his allies rather than one who kneels to every friar who crooks a finger.","after_line":"L20","conversation":"C2","took":"pressure","took_target":"other","target_line":"L20","words":"would you have a Gonfaloniere who confesses to the friars, or to France?"},{"id":"T62","turn":2,"character":"Lupo","call":"think","text":"Francesco's landed a clean one — 'the name that was not bought' — and it's aimed at the Medici purse, not mine. That's the closest anyone's come to the thing I want to know, and Raffaello let it slide off him without a word about who lends him coin. He's either clean or careful, and I still can't tell which; I keep my place, say nothing, and watch whether the barb sticks. Nothing I've said tonight needs mending — I've said nothing at all.","after_line":"L21","conversation":"C1","took":"claim","took_target":"other","target_line":"L21","words":"men trust the name that was not bought"},{"id":"T63","turn":2,"character":"Raffaello de' Medici","call":"think","text":"Francesco's last line — 'the name that was not bought' — is a barb aimed at the Medici purse, and it lands close to home, since my own debts are exactly the kind of thing that could be bought. He's shown he'll fight on the ground of honour and purchase, and he's claimed the staff for himself; that much is a claim, not a fact. I've said I'll stand, and I've said it in front of Lupo, so the boast is now a commitment. My best move is to stop fencing with Francesco and win Lupo's ear quietly, before this round closes — one more sharp answer only makes me look the brawler.","after_line":"L21","conversation":"C1","took":"insult","took_target":"other","target_line":"L21","words":"men trust the name that was not bought"},{"id":"T64","turn":2,"character":"Francesco Pazzi","call":"think","text":"Raffaello has offered the hall a truce and I have closed it with the last word — 'the name that was not bought' — which leaves the sting without the threat. He claims friends 'counted by the barrel,' but a claim is not proof; I have seen him drink alone with me and my bodyguard all night, and no other soul has joined him. I want this Capannello to end here, on my line, so the Notaio's record shows me gracious and unflustered while he stands merely a soldier with a borrowed boast. I have told no untruth tonight — only needled — and I mean to keep it so, Lupo's silence behind me my one sure card.","after_line":"L21","conversation":"C1","took":"claim","took_target":"other","target_line":"L19","target_answering":true,"words":"Friends are counted by the barrel, Francesco, and I've never yet drunk alone."},{"id":"T65","turn":2,"character":"Giorgia Pazzi","call":"think","text":"She has just condemned French pensions outright — 'a harlot in silk' — which is a slap at the Embassy and, by extension, at anyone who would take Valois gold. She has shown her hand plainly now: she is the Dominicans' creature, or wants to be seen as one, and no bribe of mine will buy her. I must not defend France here, or I brand myself her enemy and the godless Pazzi both; better to praise her piety and turn the talk to what Florence needs in a Gonfaloniere, so I learn whether her virtue has any price at all. Armand is watching, and I have said nothing untrue tonight — my mask holds.","after_line":"L22","conversation":"C2","took":"claim","took_target":"other","target_line":"L22","words":"I am no man's creature but God's."},{"id":"T66","turn":2,"character":"Captain Armand LeNoir","call":"think","text":"The widow has just called France a purse that buys men and named any pensioned ruler a harlot in silk — a public insult to my master and my embassy, and a cry for a repentant candidate that would hand Florence to the friars. I must answer it as a soldier of France, coolly, without confirming that France buys anyone here tonight — for to my knowledge no pension has yet been taken. My story stands: Lucien was a friend of my youth, no more. And I will not look too long at Giorgia, though she baited the widow well and watches how I answer for France.","after_line":"L22","conversation":"C2","took":"insult","took_target":"other","target_line":"L22","words":"France buys men with pensions, and a city ruled by purchased conscience is no better than a harlot in silk"},{"id":"T67","turn":2,"character":"Contessa Isabella","call":"think","text":"Giorgia has put me on the spot before the Captain, asking plainly whether Florence should kneel to the friars or to France — and I have answered for the friars and against French gold, which is what a penitent widow must say and what keeps me clear of any whisper of pensions. But I should be careful: I have now spoken twice of repentance and kneeling, and a clever woman like Giorgia may begin to wonder if I am campaigning rather than mourning. My story stays fixed — a widow of house and beads, no names, no French coin. I want the talk kept on the election and away from San Frediano, and I would have Giorgia as an ally rather than a watcher.","after_line":"L22","conversation":"C2","took":"pressure","took_target":"other","target_line":"L20","target_answering":true,"words":"would you have a Gonfaloniere who confesses to the friars, or to France?"},{"id":"T68","turn":2,"character":"Lupo","call":"think","text":"He's turned the blade on me now — asking plainly what I look for, in front of Francesco, to see whose man I am and whether I can be bought. A soldier's question, and a clever one: he's named the French himself, so he's either clean of them or bold enough to wave the flag he sails under. I'll give him a bodyguard's answer — a steady hand and a full purse kept full — and watch whether talk of purses makes him touch his own.","after_line":"L23","conversation":"C1","took":"pressure","took_target":"other","target_line":"L23","words":"Lupo, you've stood silent through all this. Tell me plainly what a man like you looks for"},{"id":"T69","turn":2,"character":"Francesco Pazzi","call":"think","text":"He has turned from me to Lupo — a clever move, asking my own man what he looks for in a Gonfaloniere, as if he could peel away my one silent ally in front of the Notaio. It is a claim of confidence dressed as courtesy, and I must not let Lupo be drawn into answering for the Pazzi in a hall of whispers. I want to answer for him, lightly, and let the record show that a Pazzi's men are not for hire by a Medici's flattery. I have told no untruth tonight — only needled — and I mean to keep it so.","after_line":"L23","conversation":"C1","took":"pressure","took_target":"other","target_line":"L23","words":"Lupo, you've stood silent through all this. Tell me plainly what a man like you looks for in a Gonfaloniere."},{"id":"T70","turn":2,"character":"Raffaello de' Medici","call":"think","text":"I've turned from Francesco at last and put the question to Lupo — a good move, since the man's silence is worth more than Francesco's sermons if I can win it. Francesco's last jab about 'the name that was not bought' still stings, because my debts are exactly the sort of thing that could be bought, and he's said it twice now in front of a witness. What I want now is Lupo's answer, and to hear whether he's a man who follows swords or purses — that tells me where to spend my charm. My boasts of soldiers and credit are already spent; I should let Lupo speak and weigh him, not fill the silence myself.","after_line":"L23","conversation":"C1","took":"insult","took_target":"other","target_line":"L21","target_answering":true,"words":"men trust the name that was not bought"},{"id":"T71","turn":2,"character":"Giorgia Pazzi","call":"think","text":"I answered her with honey and a needle — 'of one mind' on foreign purses, which is a lie only in what I left unsaid, for I mean to marry into France and take no pension. Now I have put the true question to her: will she judge a Pazzi as fairly as a Medici? Her answer will tell me whether her piety is a wall or a door. Armand stands close, and I must be careful that my warmth toward him reads as nothing but courtesy.","after_line":"L24","conversation":"C2","took":"claim","took_target":"other","target_line":"L22","target_answering":true,"words":"I am no man's creature but God's"},{"id":"T72","turn":2,"character":"Captain Armand LeNoir","call":"think","text":"Giorgia has turned the widow's piety back on her neatly — asking whether she'll judge a Pazzi as fairly as a Medici, which serves us both and tests whether Isabella is the friars' creature or her own. But the widow has now twice named France a purse that buys men, and no one has answered her; if I stay silent, a French captain looks either guilty or toothless. I'll answer coolly as a soldier of France — no confession that we buy anyone, for no pension has yet been taken — and put the question back where it belongs: virtue is proved in a man's deeds, not in whose hand he kneels to. My story stands: Lucien was a friend of my youth, no more.","after_line":"L24","conversation":"C2","took":"none","took_target":"other","target_line":"L24","words":null},{"id":"T73","turn":2,"character":"Contessa Isabella","call":"think","text":"Giorgia asks whether I will weigh a Pazzi's virtues as fairly as a Medici's — a fair question on its face, but she is a Pazzi asking it, and she wants to know if I am a Medici's creature or free to bless her house. I have already said virtue before faction twice tonight, so the honest answer costs me nothing and pleases her: I judge the man, not the name. But I should be careful not to sound as though I am promising my voice to the Pazzi — I am not yet sure which of them, Francesco or Piero, will bend to the friars' cause. Keep it warm, keep it even-handed, and let her think me a friend to virtue rather than a friend to her faction.","after_line":"L24","conversation":"C2","took":"pressure","took_target":"other","target_line":"L24","words":"will you weigh a Pazzi's virtues as fairly as a Medici's?"},{"id":"T74","turn":2,"character":"Francesco Pazzi","call":"think","text":"He has turned to Lupo again — or rather, he has answered my gibe about purses by going back to my own man, as if Lupo were a door into the Pazzi house. It is a claim of confidence dressed as courtesy, and I will not let the Notaio's record show a Medici questioning my bodyguard for the hall's amusement. I have told no untruth tonight — only needled — and I mean to keep it so: answer for Lupo lightly, and let the sting land on Medici purses that pay late.","after_line":"L25","conversation":"C1","took":"pressure","took_target":"other","target_line":"L23","target_answering":true,"words":"Lupo, you've stood silent through all this. Tell me plainly"},{"id":"T75","turn":2,"character":"Lupo","call":"think","text":"Francesco's done me a kindness and a cage in one breath — 'not for a Medici's flattery' keeps me his, but he's answered for me, and now the hall will look to see if I speak like a bought man. Raffaello asked plain and I owe him a plain answer; a bodyguard who names his price as 'a full purse' tells no lie and reveals nothing. Say it short, keep my eyes on his hands, and see if talk of purses makes him touch his coat.","after_line":"L25","conversation":"C1","took":"claim","took_target":"other","target_line":"L25","words":"I'd wager they look for a purse that pays on time"},{"id":"T76","turn":2,"character":"Raffaello de' Medici","call":"think","text":"Francesco's turned my question to Lupo into a jab about a purse that pays on time — the third time he's struck at money, and it's too close to the bone to be a guess. Either he's heard the rumor of my debts or he's simply found the one wound every Medici flinches at; I can't tell which, and that's what worries me. If I answer hotly now, I confirm the wound; if I let it pass, Lupo hears the Pazzi's word unanswered. Better to laugh it off lightly, as a soldier laughs at a bad throw, and turn back to Lupo so the last word in this Capannello is mine and not Francesco's.","after_line":"L25","conversation":"C1","took":"insult","took_target":"other","target_line":"L25","words":"I'd wager they look for a purse that pays on time"},{"id":"T77","turn":2,"character":"Giorgia Pazzi","call":"think","text":"Armand has just defended France to a woman who called French gold a harlot's silk — brave, and foolish, and it draws every eye to him and to anyone seen warm with him. I must not leap to his defense, or Isabella will read more than courtesy between us; better to smooth the moment with honey and turn it, praising both their honesty while saying nothing that binds me to France. He has claimed France kept faith with Florence — a soldier's loyalty, not proof of anything, and I will not treat it as confession. My story stays straight: I have called no one a liar and named no candidate.","after_line":"L26","conversation":"C2","took":"none","took_target":"other","target_line":"L26","words":null},{"id":"T78","turn":2,"character":"Captain Armand LeNoir","call":"think","text":"The widow has called France a purse that buys men and named any pensioned ruler a harlot in silk — a public insult to my master, and a cry for a repentant candidate that would hand Florence to the friars. I answered her coolly and truthfully: no pension has been bought in this hall tonight, to my knowledge, and I will not confess to one. She claims she is no man's creature but God's — a claim, not proof, and her stare in our chapel still nags at me. I want to press her once more on San Frediano, but gently, before Giorgia's presence; and I must keep my eyes off Giorgia, though she baits the widow well.","after_line":"L26","conversation":"C2","took":"insult","took_target":"other","target_line":"L24","target_answering":true,"words":null,"words_log":{"wrong_line":"L22","raw":"France buys men with pensions"}},{"id":"T79","turn":2,"character":"Contessa Isabella","call":"think","text":"LeNoir has turned my own words against me and now defends France openly — he calls my piety a purse of beads and challenges me to name a deed of virtue. He claims no pension has been bought in this hall tonight, which is a claim, not a fact I can trust; and behind it all he still nurses his dead friend. I must answer calmly, without heat, turning his challenge into a lesson on deeds — and above all keep the talk off San Frediano. I have told them I kept to my house and beads in those years, so my story must stay fixed there.","after_line":"L26","conversation":"C2","took":"insult","took_target":"other","target_line":"L26","words":null,"words_log":{"fallback":"not in line","raw":"Virtue is proved in a man's deeds, not in whose purse you refuse"}},{"id":"T80","turn":2,"character":"Lupo","call":"think","text":"He's offered me a drink and a promise to ask again later — a soldier's way of saying he wants a private word without the hall watching. 'Never let a man of mine go unpaid' is a boast, not a purse I've seen, but a man who talks that way about paying has coin and may have work. I'll take the drink and let him come to me; I've said nothing tonight that needs mending, and Francesco's answered for me twice now, so silence serves me better than a speech.","after_line":"L27","conversation":"C1","took":"promise","took_target":"other","target_line":"L27","words":"I'll ask you plainly another day, when there's less noise about."},{"id":"T81","turn":2,"character":"Francesco Pazzi","call":"think","text":"He has come back to Lupo a third time — 'I'll ask you plainly another day' — as if my bodyguard were a door he means to try again when the Notaio's ink is thinner. It is a claim of patience and good fellowship, and the drink he offers is a small bribe of manners, no Florins in it. I will not let the record show a Medici marking my man for later; answer lightly, decline the cup for both of us, and let the sting be that a Pazzi's men drink at a Pazzi's table. I have told no untruth tonight — only needled.","after_line":"L27","conversation":"C1","took":"claim","took_target":"other","target_line":"L27","words":"Lupo, I'll ask you plainly another day, when there's less noise about."},{"id":"T82","turn":2,"character":"Raffaello de' Medici","call":"think","text":"Francesco's struck at my purse a third time, and now he's trying to answer for Lupo as if the man were his servant — that's a small gift, since it shows he needs to own the room. I've said I'll drink with Lupo and let him judge the purse by the man, which is a fair soldier's line and doesn't confirm a thing about my debts. What I want now is to close this Capannello on my own note and get LeNoir alone before the round runs out — but I shouldn't seem to bolt the moment I've spoken. I'll hold a beat, keep it light, and let Lupo come to me if he's minded to.","after_line":"L27","conversation":"C1","took":"insult","took_target":"other","target_line":"L25","target_answering":true,"words":"I'd wager they look for a purse that pays on time"},{"id":"T83","turn":2,"character":"Contessa Isabella","call":"think","text":"I have just named a deed — forgiving Raffaello's gaming debt — and in doing so I have put a Medici's name near my mouth and a small truth on the table. It serves me twice: it makes my piety look like practice, and it reminds Raffaello, if he hears of it, that I am his creditor turned benefactor. But I must be careful not to be pressed for the young man's name, for a public naming would shame him and make an enemy where I want a friend. Let LeNoir and Giorgia take the lesson and let the talk move on.","after_line":"L28","conversation":"C2","took":"none","took_target":"other","target_line":"L26","target_answering":true,"words":null},{"id":"T84","turn":2,"character":"Captain Armand LeNoir","call":"think","text":"A gaming debt forgiven — she says it lightly, but it lands close to my own wound, for Lucien died over gaming debts in this city. Is she baiting me, or does she truly know something of the back rooms and who paid there? She names a deed but no names, and a claim of mercy is not proof of innocence. I want to press her once more — gently, before Giorgia — on who in her house kept such company, but I must not let my tem
