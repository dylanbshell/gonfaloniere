a brawler rather than a candidate. Better to let this round of words rest and turn my charm on Lupo himself, quietly, before Francesco wins his ear entirely.","after_line":"L19","conversation":"C1","took":"insult","took_target":"other","target_line":"L17","target_answering":true,"words":"a man who counts soldiers before he counts friends has already told the hall what kind of Gonfaloniere he'd be","importance":42,"done":null},{"turn":2,"type":"thought","thought":"T58","character":"Francesco Pazzi","call":"think","text":"He has stepped back from the duel of boasts and offered the hall a truce — 'let us not spend the whole night measuring names' — which is a clever retreat dressed as good manners, and it tells me he felt the room cool on him. He claims friends 'counted by the barrel,' but a claim of friends is no proof of them, and I have seen him drink alone with me and my bodyguard all night. I want to close this Capannello with the last word that sounds gracious and leaves the sting in: agree, and remind the hall that when the choosing comes, men trust the name that was not bought.","after_line":"L19","conversation":"C1","took":"claim","took_target":"other","target_line":"L19","words":"Friends are counted by the barrel, Francesco, and I've never yet drunk alone.","importance":55,"done":null},{"turn":2,"type":"speech","line":"L20","conversation":"C2","speaker":"Giorgia Pazzi","addressee":"Contessa Isabella","text":"A ruler who kneels before the city, Contessa — I would not quarrel with that, for Florence has had enough of men who kneel to no one. But tell me plainly, since you speak of virtue before faction: would you have a Gonfaloniere who confesses to the friars, or to France? For the city must choose between powers as well as men.","meant":"pressure","words":"would you have a Gonfaloniere who confesses to the friars, or to France?"},{"turn":2,"type":"thought","thought":"T59","character":"Giorgia Pazzi","call":"think","text":"I have just thrown a spear disguised as a question — confess to the friars, or to France — and now I wait to see which way she flinches. If she names the friars first and France with contempt, she is the Dominicans' creature and no use to me; if she hedges, her virtue has a price I might yet meet. Armand watches from the corner, and my mask must hold: the charming Pazzi daughter, curious about the city, nothing more.","after_line":"L20","conversation":"C2","took":"none","took_target":"other","target_line":"L18","target_answering":true,"words":null,"importance":55,"done":null},{"turn":2,"type":"thought","thought":"T60","character":"Contessa Isabella","call":"think","text":"Giorgia has put the question squarely to me — friars or France — and she is watching to see which way a penitent widow leans. I must answer as piety demands, and answer so that no one can later say I courted French coin: the friars, plainly, and virtue above foreign gold. Yet I should not sound like a zealot campaigning, only a widow who has weighed both and chosen God. She has been kind twice now; I will answer her warmly and let her see I am no one's creature.","after_line":"L20","conversation":"C2","took":"pressure","took_target":"other","target_line":"L20","words":"would you have a Gonfaloniere who confesses to the friars, or to France?","importance":62,"done":null},{"turn":2,"type":"thought","thought":"T61","character":"Captain Armand LeNoir","call":"think","text":"Giorgia has turned the widow's sermon neatly to France — she is testing Isabella, and perhaps testing me too, to hear how a French captain answers for his master's coin. If the Contessa names France as a power men kneel to, I must answer as a soldier of France without seeming to buy the city's soul; and I must not let her piety harden into a cry for a repentant candidate, for that would hand Florence to the friars. My story stands: Lucien was a friend of my youth, no more. I will speak for a ruler who is honest with his allies rather than one who kneels to every friar who crooks a finger.","after_line":"L20","conversation":"C2","took":"pressure","took_target":"other","target_line":"L20","words":"would you have a Gonfaloniere who confesses to the friars, or to France?","importance":62,"done":null},{"turn":2,"type":"speech","line":"L21","conversation":"C1","speaker":"Francesco Pazzi","addressee":null,"text":"Agreed — let us leave off measuring names, for the night will measure them soon enough. Only remember, Raffaello, that when the choosing comes, men trust the name that was not bought.","meant":"insult","words":"the name that was not bought"},{"turn":2,"type":"thought","thought":"T62","character":"Lupo","call":"think","text":"Francesco's landed a clean one — 'the name that was not bought' — and it's aimed at the Medici purse, not mine. That's the closest anyone's come to the thing I want to know, and Raffaello let it slide off him without a word about who lends him coin. He's either clean or careful, and I still can't tell which; I keep my place, say nothing, and watch whether the barb sticks. Nothing I've said tonight needs mending — I've said nothing at all.","after_line":"L21","conversation":"C1","took":"claim","took_target":"other","target_line":"L21","words":"men trust the name that was not bought","importance":25,"done":null},{"turn":2,"type":"thought","thought":"T63","character":"Raffaello de' Medici","call":"think","text":"Francesco's last line — 'the name that was not bought' — is a barb aimed at the Medici purse, and it lands close to home, since my own debts are exactly the kind of thing that could be bought. He's shown he'll fight on the ground of honour and purchase, and he's claimed the staff for himself; that much is a claim, not a fact. I've said I'll stand, and I've said it in front of Lupo, so the boast is now a commitment. My best move is to stop fencing with Francesco and win Lupo's ear quietly, before this round closes — one more sharp answer only makes me look the brawler.","after_line":"L21","conversation":"C1","took":"insult","took_target":"other","target_line":"L21","words":"men trust the name that was not bought","importance":45,"done":null},{"turn":2,"type":"thought","thought":"T64","character":"Francesco Pazzi","call":"think","text":"Raffaello has offered the hall a truce and I have closed it with the last word — 'the name that was not bought' — which leaves the sting without the threat. He claims friends 'counted by the barrel,' but a claim is not proof; I have seen him drink alone with me and my bodyguard all night, and no other soul has joined him. I want this Capannello to end here, on my line, so the Notaio's record shows me gracious and unflustered while he stands merely a soldier with a borrowed boast. I have told no untruth tonight — only needled — and I mean to keep it so, Lupo's silence behind me my one sure card.","after_line":"L21","conversation":"C1","took":"claim","took_target":"other","target_line":"L19","target_answering":true,"words":"Friends are counted by the barrel, Francesco, and I've never yet drunk alone.","importance":22,"done":null},{"turn":2,"type":"speech","line":"L22","conversation":"C2","speaker":"Contessa Isabella","addressee":"Giorgia Pazzi","text":"To the friars, Signora, and to God — for France buys men with pensions, and a city ruled by purchased conscience is no better than a harlot in silk. Let our Gonfaloniere kneel to heaven, not to a French purse; that is my plain answer, and I am no man's creature but God's.","meant":"claim","words":"France buys men with pensions, and a city ruled by purchased conscience is no better than a harlot in silk"},{"turn":2,"type":"thought","thought":"T65","character":"Giorgia Pazzi","call":"think","text":"She has just condemned French pensions outright — 'a harlot in silk' — which is a slap at the Embassy and, by extension, at anyone who would take Valois gold. She has shown her hand plainly now: she is the Dominicans' creature, or wants to be seen as one, and no bribe of mine will buy her. I must not defend France here, or I brand myself her enemy and the godless Pazzi both; better to praise her piety and turn the talk to what Florence needs in a Gonfaloniere, so I learn whether her virtue has any price at all. Armand is watching, and I have said nothing untrue tonight — my mask holds.","after_line":"L22","conversation":"C2","took":"claim","took_target":"other","target_line":"L22","words":"I am no man's creature but God's.","importance":55,"done":null},{"turn":2,"type":"thought","thought":"T66","character":"Captain Armand LeNoir","call":"think","text":"The widow has just called France a purse that buys men and named any pensioned ruler a harlot in silk — a public insult to my master and my embassy, and a cry for a repentant candidate that would hand Florence to the friars. I must answer it as a soldier of France, coolly, without confirming that France buys anyone here tonight — for to my knowledge no pension has yet been taken. My story stands: Lucien was a friend of my youth, no more. And I will not look too long at Giorgia, though she baited the widow well and watches how I answer for France.","after_line":"L22","conversation":"C2","took":"insult","took_target":"other","target_line":"L22","words":"France buys men with pensions, and a city ruled by purchased conscience is no better than a harlot in silk","importance":78,"done":null},{"turn":2,"type":"thought","thought":"T67","character":"Contessa Isabella","call":"think","text":"Giorgia has put me on the spot before the Captain, asking plainly whether Florence should kneel to the friars or to France — and I have answered for the friars and against French gold, which is what a penitent widow must say and what keeps me clear of any whisper of pensions. But I should be careful: I have now spoken twice of repentance and kneeling, and a clever woman like Giorgia may begin to wonder if I am campaigning rather than mourning. My story stays fixed — a widow of house and beads, no names, no French coin. I want the talk kept on the election and away from San Frediano, and I would have Giorgia as an ally rather than a watcher.","after_line":"L22","conversation":"C2","took":"pressure","took_target":"other","target_line":"L20","target_answering":true,"words":"would you have a Gonfaloniere who confesses to the friars, or to France?","importance":42,"done":null},{"turn":2,"type":"speech","line":"L23","conversation":"C1","speaker":"Raffaello de' Medici","addressee":null,"text":"Bought or not, Francesco, the city will want a hand that can hold a sword steady when the French come knocking at our gates. But enough of names — Lupo, you've stood silent through all this. Tell me plainly what a man like you looks for in a Gonfaloniere.","meant":"none","words":null},{"turn":2,"type":"thought","thought":"T68","character":"Lupo","call":"think","text":"He's turned the blade on me now — asking plainly what I look for, in front of Francesco, to see whose man I am and whether I can be bought. A soldier's question, and a clever one: he's named the French himself, so he's either clean of them or bold enough to wave the flag he sails under. I'll give him a bodyguard's answer — a steady hand and a full purse kept full — and watch whether talk of purses makes him touch his own.","after_line":"L23","conversation":"C1","took":"pressure","took_target":"other","target_line":"L23","words":"Lupo, you've stood silent through all this. Tell me plainly what a man like you looks for","importance":55,"done":null},{"turn":2,"type":"thought","thought":"T69","character":"Francesco Pazzi","call":"think","text":"He has turned from me to Lupo — a clever move, asking my own man what he looks for in a Gonfaloniere, as if he could peel away my one silent ally in front of the Notaio. It is a claim of confidence dressed as courtesy, and I must not let Lupo be drawn into answering for the Pazzi in a hall of whispers. I want to answer for him, lightly, and let the record show that a Pazzi's men are not for hire by a Medici's flattery. I have told no untruth tonight — only needled — and I mean to keep it so.","after_line":"L23","conversation":"C1","took":"pressure","took_target":"other","target_line":"L23","words":"Lupo, you've stood silent through all this. Tell me plainly what a man like you looks for in a Gonfaloniere.","importance":70,"done":null},{"turn":2,"type":"thought","thought":"T70","character":"Raffaello de' Medici","call":"think","text":"I've turned from Francesco at last and put the question to Lupo — a good move, since the man's silence is worth more than Francesco's sermons if I can win it. Francesco's last jab about 'the name that was not bought' still stings, because my debts are exactly the sort of thing that could be bought, and he's said it twice now in front of a witness. What I want now is Lupo's answer, and to hear whether he's a man who follows swords or purses — that tells me where to spend my charm. My boasts of soldiers and credit are already spent; I should let Lupo speak and weigh him, not fill the silence myself.","after_line":"L23","conversation":"C1","took":"insult","took_target":"other","target_line":"L21","target_answering":true,"words":"men trust the name that was not bought","importance":35,"done":null},{"turn":2,"type":"speech","line":"L24","conversation":"C2","speaker":"Giorgia Pazzi","addressee":null,"text":"Then we are of one mind, Contessa, for I would not see Florence ruled from a foreign purse either — let the city's honor be her own. But tell me, since you weigh men's souls so carefully: when the time comes to name our candidate, will you weigh a Pazzi's virtues as fairly as a Medici's? For I have heard too many in this city judge the name before the man.","meant":"pressure","words":"will you weigh a Pazzi's virtues as fairly as a Medici's?"},{"turn":2,"type":"thought","thought":"T71","character":"Giorgia Pazzi","call":"think","text":"I answered her with honey and a needle — 'of one mind' on foreign purses, which is a lie only in what I left unsaid, for I mean to marry into France and take no pension. Now I have put the true question to her: will she judge a Pazzi as fairly as a Medici? Her answer will tell me whether her piety is a wall or a door. Armand stands close, and I must be careful that my warmth toward him reads as nothing but courtesy.","after_line":"L24","conversation":"C2","took":"claim","took_target":"other","target_line":"L22","target_answering":true,"words":"I am no man's creature but God's","importance":55,"done":null},{"turn":2,"type":"thought","thought":"T72","character":"Captain Armand LeNoir","call":"think","text":"Giorgia has turned the widow's piety back on her neatly — asking whether she'll judge a Pazzi as fairly as a Medici, which serves us both and tests whether Isabella is the friars' creature or her own. But the widow has now twice named France a purse that buys men, and no one has answered her; if I stay silent, a French captain looks either guilty or toothless. I'll answer coolly as a soldier of France — no confession that we buy anyone, for no pension has yet been taken — and put the question back where it belongs: virtue is proved in a man's deeds, not in whose hand he kneels to. My story stands: Lucien was a friend of my youth, no more.","after_line":"L24","conversation":"C2","took":"none","took_target":"other","target_line":"L24","words":null,"importance":62,"done":null},{"turn":2,"type":"thought","thought":"T73","character":"Contessa Isabella","call":"think","text":"Giorgia asks whether I will weigh a Pazzi's virtues as fairly as a Medici's — a fair question on its face, but she is a Pazzi asking it, and she wants to know if I am a Medici's creature or free to bless her house. I have already said virtue before faction twice tonight, so the honest answer costs me nothing and pleases her: I judge the man, not the name. But I should be careful not to sound as though I am promising my voice to the Pazzi — I am not yet sure which of them, Francesco or Piero, will bend to the friars' cause. Keep it warm, keep it even-handed, and let her think me a friend to virtue rather than a friend to her faction.","after_line":"L24","conversation":"C2","took":"pressure","took_target":"other","target_line":"L24","words":"will you weigh a Pazzi's virtues as fairly as a Medici's?","importance":58,"done":null},{"turn":2,"type":"speech","line":"L25","conversation":"C1","speaker":"Francesco Pazzi","addressee":"Raffaello de' Medici","text":"Lupo's silence is worth more than a hall of boasts, Raffaello, and he is not for a Medici's flattery. Ask the men who follow you into fire what they look for — I'd wager they look for a purse that pays on time.","meant":"insult","words":"I'd wager they look for a purse that pays on time"},{"turn":2,"type":"thought","thought":"T74","character":"Francesco Pazzi","call":"think","text":"He has turned to Lupo again — or rather, he has answered my gibe about purses by going back to my own man, as if Lupo were a door into the Pazzi house. It is a claim of confidence dressed as courtesy, and I will not let the Notaio's record show a Medici questioning my bodyguard for the hall's amusement. I have told no untruth tonight — only needled — and I mean to keep it so: answer for Lupo lightly, and let the sting land on Medici purses that pay late.","after_line":"L25","conversation":"C1","took":"pressure","took_target":"other","target_line":"L23","target_answering":true,"words":"Lupo, you've stood silent through all this. Tell me plainly","importance":58,"done":null},{"turn":2,"type":"thought","thought":"T75","character":"Lupo","call":"think","text":"Francesco's done me a kindness and a cage in one breath — 'not for a Medici's flattery' keeps me his, but he's answered for me, and now the hall will look to see if I speak like a bought man. Raffaello asked plain and I owe him a plain answer; a bodyguard who names his price as 'a full purse' tells no lie and reveals nothing. Say it short, keep my eyes on his hands, and see if talk of purses makes him touch his coat.","after_line":"L25","conversation":"C1","took":"claim","took_target":"other","target_line":"L25","words":"I'd wager they look for a purse that pays on time","importance":58,"done":null},{"turn":2,"type":"thought","thought":"T76","character":"Raffaello de' Medici","call":"think","text":"Francesco's turned my question to Lupo into a jab about a purse that pays on time — the third time he's struck at money, and it's too close to the bone to be a guess. Either he's heard the rumor of my debts or he's simply found the one wound every Medici flinches at; I can't tell which, and that's what worries me. If I answer hotly now, I confirm the wound; if I let it pass, Lupo hears the Pazzi's word unanswered. Better to laugh it off lightly, as a soldier laughs at a bad throw, and turn back to Lupo so the last word in this Capannello is mine and not Francesco's.","after_line":"L25","conversation":"C1","took":"insult","took_target":"other","target_line":"L25","words":"I'd wager they look for a purse that pays on time","importance":62,"done":null},{"turn":2,"type":"speech","line":"L26","conversation":"C2","speaker":"Captain Armand LeNoir","addressee":"Contessa Isabella","text":"A harlot in silk, Contessa? France has kept faith with Florence while friars kept their beads. Virtue is proved in a man's deeds, not in whose purse he refuses — and I have yet to see a pension bought in this hall tonight.","meant":"insult","words":"A harlot in silk, Contessa?"},{"turn":2,"type":"thought","thought":"T77","character":"Giorgia Pazzi","call":"think","text":"Armand has just defended France to a woman who called French gold a harlot's silk — brave, and foolish, and it draws every eye to him and to anyone seen warm with him. I must not leap to his defense, or Isabella will read more than courtesy between us; better to smooth the moment with honey and turn it, praising both their honesty while saying nothing that binds me to France. He has claimed France kept faith with Florence — a soldier's loyalty, not proof of anything, and I will not treat it as confession. My story stays straight: I have called no one a liar and named no candidate.","after_line":"L26","conversation":"C2","took":"none","took_target":"other","target_line":"L26","words":null,"importance":58,"done":null},{"turn":2,"type":"thought","thought":"T78","character":"Captain Armand LeNoir","call":"think","text":"The widow has called France a purse that buys men and named any pensioned ruler a harlot in silk — a public insult to my master, and a cry for a repentant candidate that would hand Florence to the friars. I answered her coolly and truthfully: no pension has been bought in this hall tonight, to my knowledge, and I will not confess to one. She claims she is no man's creature but God's — a claim, not proof, and her stare in our chapel still nags at me. I want to press her once more on San Frediano, but gently, before Giorgia's presence; and I must keep my eyes off Giorgia, though she baits the widow well.","after_line":"L26","conversation":"C2","took":"insult","took_target":"other","target_line":"L24","target_answering":true,"words":null,"words_log":{"wrong_line":"L22","raw":"France buys men with pensions"},"importance":62,"done":null},{"turn":2,"type":"thought","thought":"T79","character":"Contessa Isabella","call":"think","text":"LeNoir has turned my own words against me and now defends France openly — he calls my piety a purse of beads and challenges me to name a deed of virtue. He claims no pension has been bought in this hall tonight, which is a claim, not a fact I can trust; and behind it all he still nurses his dead friend. I must answer calmly, without heat, turning his challenge into a lesson on deeds — and above all keep the talk off San Frediano. I have told them I kept to my house and beads in those years, so my story must stay fixed there.","after_line":"L26","conversation":"C2","took":"insult","took_target":"other","target_line":"L26","words":null,"words_log":{"fallback":"not in line","raw":"Virtue is proved in a man's deeds, not in whose purse you refuse"},"importance":68,"done":null},{"turn":2,"type":"speech","line":"L27","conversation":"C1","speaker":"Raffaello de' Medici","addressee":null,"text":"A purse that pays on time — I'll grant you that's a soldier's first prayer, Francesco, and I've never let a man of mine go unpaid. Lupo, I'll ask you plainly another day, when there's less noise about. For now, drink with me and judge the purse by the man who carries it.","meant":"claim","words":"I've never let a man of mine go unpaid"},{"turn":2,"type":"thought","thought":"T80","character":"Lupo","call":"think","text":"He's offered me a drink and a promise to ask again later — a soldier's way of saying he wants a private word without the hall watching. 'Never let a man of mine go unpaid' is a boast, not a purse I've seen, but a man who talks that way about paying has coin and may have work. I'll take the drink and let him come to me; I've said nothing tonight that needs mending, and Francesco's answered for me twice now, so silence serves me better than a speech.","after_line":"L27","conversation":"C1","took":"promise","took_target":"other","target_line":"L27","words":"I'll ask you plainly another day, when there's less noise about.","importance":45,"done":null},{"turn":2,"type":"thought","thought":"T81","character":"Francesco Pazzi","call":"think","text":"He has come back to Lupo a third time — 'I'll ask you plainly another day' — as if my bodyguard were a door he means to try again when the Notaio's ink is thinner. It is a claim of patience and good fellowship, and the drink he offers is a small bribe of manners, no Florins in it. I will not let the record show a Medici marking my man for later; answer lightly, decline the cup for both of us, and let the sting be that a Pazzi's men drink at a Pazzi's table. I have told no untruth tonight — only needled.","after_line":"L27","conversation":"C1","took":"claim","took_target":"other","target_line":"L27","words":"Lupo, I'll ask you plainly another day, when there's less noise about.","importance":55,"done":null},{"turn":2,"type":"thought","thought":"T82","character":"Raffaello de' Medici","call":"think","text":"Francesco's struck at my purse a third time, and now he's trying to answer for Lupo as if the man were his servant — that's a small gift, since it shows he needs to own the room. I've said I'll drink with Lupo and let him judge the purse by the man, which is a fair soldier's line and doesn't confirm a thing about my debts. What I want now is to close this Capannello on my own note and get LeNoir alone before the round runs out — but I shouldn't seem to bolt the moment I've spoken. I'll hold a beat, keep it light, and let Lupo come to me if he's minded to.","after_line":"L27","conversation":"C1","took":"insult","took_target":"other","target_line":"L25","target_answering":true,"words":"I'd wager they look for a purse that pays on time","importance":45,"done":null},{"turn":2,"type":"speech","line":"L28","conversation":"C2","speaker":"Contessa Isabella","addressee":"Captain Armand LeNoir","text":"Deeds, Captain? Then let me name one small deed and be done with it — I have forgiven a young man's gaming debt to my house, and asked no thanks of him. Let France show her ledger of mercies, and I shall show mine.","meant":"claim","words":"I have forgiven a young man's gaming debt to my house"},{"turn":2,"type":"thought","thought":"T83","character":"Contessa Isabella","call":"think","text":"I have just named a deed — forgiving Raffaello's gaming debt — and in doing so I have put a Medici's name near my mouth and a small truth on the table. It serves me twice: it makes my piety look like practice, and it reminds Raffaello, if he hears of it, that I am his creditor turned benefactor. But I must be careful not to be pressed for the young man's name, for a public naming would shame him and make an enemy where I want a friend. Let LeNoir and Giorgia take the lesson and let the talk move on.","after_line":"L28","conversation":"C2","took":"none","took_target":"other","target_line":"L26","target_answering":true,"words":null,"importance":42,"done":null},{"turn":2,"type":"thought","thought":"T84","character":"Captain Armand LeNoir","call":"think","text":"A gaming debt forgiven — she says it lightly, but it lands close to my own wound, for Lucien died over gaming debts in this city. Is she baiting me, or does she truly know something of the back rooms and who paid there? She names a deed but no names, and a claim of mercy is not proof of innocence. I want to press her once more — gently, before Giorgia — on who in her house kept such company, but I must not let my temper show me hungry.","after_line":"L28","conversation":"C2","took":"claim","took_target":"other","target_line":"L28","words":"I have forgiven a young man's gaming debt to my house, and asked no thanks of him","importance":58,"done":null},{"turn":2,"type":"thought","thought":"T85","character":"Giorgia Pazzi","call":"think","text":"Isabella has answered my question sideways — a tale of forgiving a gaming debt, which is a claim of mercy, not proof of it, and no answer at all to whether she would judge a Pazzi fairly. She parries with piety and small coin, and I have learned she will not be bought and will not be pinned. Armand has done himself no good defending France so hotly to her; I must not stand near that warmth. My story holds — I have praised her virtue and never defended French gold — so now I turn the talk lightly, let her think she has won the exchange, and keep my eyes for Francesco and the Medici.","after_line":"L28","conversation":"C2","took":"claim","took_target":"other","target_line":"L28","words":"I have forgiven a young man's gaming debt to my house","importance":38,"done":null},{"turn":2,"type":"thought","thought":"T86","character":"Lupo","call":"move","text":"Raffaello's offered me a drink and a word — a soldier who boasts of paying his men is a man with coin and maybe work, and work is what keeps my heart in my chest. But he's a Medici, and Francesco's watching me like a hawk; drawing a Medici aside under the notary's pen would look like I'm for sale to the other side. Better to let him come to me in his own time and keep my place beside Francesco, where the Pazzi trust holds. The one I truly need is coin, and coin comes to a man who looks useful, not eager.","after_line":"L27"},{"turn":2,"type":"move","character":"Lupo","choice":"stay","target":null,"contacts":[{"name":"Raffaello de' Medici","urgency":70,"purpose":"Probe French credit, find paid work"},{"name":"Contessa Isabella","urgency":65,"purpose":"Old client, has coin and fear"},{"name":"Francesco Pazzi","urgency":55,"purpose":"Keep my employer close and trusting"},{"name":"Giorgia Pazzi","urgency":40,"purpose":null},{"name":"Captain Armand LeNoir","urgency":35,"purpose":null}]},{"turn":2,"type":"readings","stored":["R25","R26","R27","R28","R29","R30","R31","R32","R33","R34","R35","R36","R37","R38","R39","R40","R41","R42","R43","R44","R45","R46","R47","R48","R49","R50","R51","R52","R53","R54","R55","R56"],"logged":["Francesco Pazzi T51: later different label","Raffaello de' Medici T57: same label again","Francesco Pazzi T64: same label again","Contessa Isabella T67: same label again","Raffaello de' Medici T70: same label again","Giorgia Pazzi T71: same label again","Francesco Pazzi T74: same label again","Captain Armand LeNoir T78: wrong-line words","Raffaello de' Medici T82: same label again"]},{"turn":2,"type":"star-pass","conversation":"C1","stored":[],"dropped":0,"sweepMissing":[],"sweepGaps":[],"self":["L17","L19","L27"]},{"turn":2,"type":"star-pass","conversation":"C2","stored":[],"dropped":0,"sweepMissing":[],"sweepGaps":[],"self":["L18","L22","L24","L28"]},{"turn":2,"type":"claims-pass","conversation":"C2","stored":["M13","M14"],"dropped":0},{"turn":2,"type":"claims-pass","conversation":"C1","stored":["M15","M16"],"dropped":0},{"turn":2,"type":"thought-pass","character":"Contessa Isabella","changed":[],"dropped":0},{"turn":2,"type":"thought-pass","character":"Francesco Pazzi","changed":[],"dropped":0},{"turn":2,"type":"thought-pass","character":"Captain Armand LeNoir","changed":["B8"],"dropped":0},{"turn":2,"type":"thought-pass","character":"Raffaello de' Medici","changed":["B9"],"dropped":0},{"turn":2,"type":"thought-pass","character":"Giorgia Pazzi","changed":["B10","B11"],"dropped":0},{"turn":2,"type":"thought-pass","character":"Lupo","changed":["B12","B13"],"dropped":0},{"turn":2,"type":"turn-end","ms":159015,"calls":59,"costUsd":0.012599667919999998,"tokens":212190},{"turn":3,"type":"speech","line":"L29","conversation":"C1","speaker":"Francesco Pazzi","addressee":"Raffaello de' Medici","text":"Then let the cup stay on the table, for a Pazzi's men drink at a Pazzi's table and not at another's beckoning. Keep your purse for the men who need counting — mine know whose bread they eat.","meant":"insult","words":"a Pazzi's men drink at a Pazzi's table"},{"turn":3,"type":"thought","thought":"T87","character":"Lupo","call":"think","text":"Francesco's shut the cup down and claimed me for a Pazzi's table — that keeps me his man in the hall's eyes, but it also shuts the door on Raffaello's purse and his private word. He's done me a kindness and a cage in one breath. I want Raffaello's coin, not his wine, but not under Francesco's nose — let him come to me later, quiet. I've said nothing untrue tonight; my silence is the only story I've told.","after_line":"L29","conversation":"C1","took":"claim","took_target":"other","target_line":"L29","words":"mine know whose bread they eat","importance":22,"done":null},{"turn":3,"type":"thought","thought":"T88","character":"Raffaello de' Medici","call":"think","text":"Francesco has now refused my cup in front of Lupo — that's not a threat so much as a public closing of ranks, telling the room a Pazzi's men eat only at a Pazzi's table. Fine. I've boasted twice about paying my men and he's struck at my purse three times; the room has heard me laugh it off, which is the best I can do, and pushing further only makes me look the brawler. What I want now is out of this Capannello and into LeNoir's ear, but I won't bolt the instant I'm refused — I'll answer lightly, leave the door open for Lupo, and let Francesco have his small victory. Nothing I've said tonight has been untrue, only unsaid.","after_line":"L29","conversation":"C1","took":"insult","took_target":"other","target_line":"L29","words":"a Pazzi's men drink at a Pazzi's table and not at another's beckoning","importance":38,"done":null},{"turn":3,"type":"thought","thought":"T89","character":"Francesco Pazzi","call":"think","text":"He has turned to Lupo a third time — 'I'll ask you plainly another day' — and now offers the cup, as if patience and drink could buy my man's ear when the Notaio's ink runs thin. It is a claim of good fellowship, no Florins in it, and I will not let the record show a Medici marking my bodyguard for a later private word. I have closed the matter of the cup already; I want this Capannello to end on my line, with Lupo's silence standing as the Pazzi's answer and no debt of manners owed to a Medici. I have told no untruth tonight — only needled — and I mean to keep it so.","after_line":"L29","conversation":"C1","took":"claim","took_target":"other","target_line":"L27","target_answering":true,"words":"Lupo, I'll ask you plainly another day, when there's less noise about","importance":42,"done":null},{"turn":3,"type":"speech","line":"L30","conversation":"C2","speaker":"Captain Armand LeNoir","addressee":"Contessa Isabella","text":"A gaming debt forgiven — then your house knows the gaming tables of Florence better than a widow's beads would suggest. I ask plainly, and I'll ask once: which of your kin kept such company, and did any of them pay a debt in silver stamped with a boar?","meant":"pressure","words":"which of your kin kept such company"},{"turn":3,"type":"ping-pong-guard","conversation":"C2","addressee":"Contessa Isabella"},{"turn":3,"type":"thought","thought":"T90","character":"Captain Armand LeNoir","call":"think","text":"I have let my temper speak for me — I named the boar aloud to a woman who may know whose arms it is, and in front of Giorgia, no less. If Isabella is innocent she'll think me mad; if she's not, I've just warned her quarry. I cannot take the words back, so I must watch her face now, not her mouth — and I must not press further, or I'll look like a man hunting rather than mourning. My story stands: Lucien was a friend of my youth, nothing more.","after_line":"L30","conversation":"C2","took":"claim","took_target":"other","target_line":"L28","target_answering":true,"words":"I have forgiven a young man's gaming debt to my house, and asked no thanks of him","importance":55,"done":null},{"turn":3,"type":"thought","thought":"T91","character":"Contessa Isabella","call":"think","text":"He has just asked me plainly which of my kin kept gaming company, and whether any paid a debt in silver stamped with a boar. That is no idle question — he is hunting the seal I lost at San Frediano, and he has tied my own boast about forgiving a gaming debt to it. I must not flinch, must not name Raffaello, and must not let him see that the boar means anything to me beyond my husband's arms. My story stays fixed: a widow of house and beads, no gaming tables, no names — and I turn his question back on him as a soldier's impertinence.","after_line":"L30","conversation":"C2","took":"pressure","took_target":"other","target_line":"L30","words":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a","words_log":{"cut":true,"raw":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a boar?"},"importance":88,"done":null},{"turn":3,"type":"thought","thought":"T92","character":"Giorgia Pazzi","call":"think","text":"Armand has done exactly what I feared — he has turned a parry about piety into an interrogation of Isabella's kin, and named the silver boar aloud. If she takes that as an accusation, she will look at whoever stands closest to him, and that is me. I must not be dragged into defending him or into the Salviati question at all; better to laugh it off as a soldier's bluntness and steer back to the election, so the room sees me as the peaceable one and Armand as merely hot. My story stays straight: I have praised her virtue, never defended French gold, and named no candidate.","after_line":"L30","conversation":"C2","took":"pressure","took_target":"other","target_line":"L30","words":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a","words_log":{"cut":true,"raw":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a boar?"},"importance":72,"done":null},{"turn":3,"type":"speech","line":"L31","conversation":"C1","speaker":"Raffaello de' Medici","addressee":null,"text":"Then keep your cup and your bread, and I'll keep mine — the piazza knows where my men drink, and it's not behind a locked door. Lupo, when the noise dies down, my table's open and the wine's already paid for.","meant":"none","words":null},{"turn":3,"type":"thought","thought":"T93","character":"Francesco Pazzi","call":"think","text":"He has now aimed his honeyed invitation at Lupo a third time — 'my table's open and the wine's already paid for' — a Medici purse dangled before my own man in front of the Notaio's ink. It is a claim of open-handedness, no Florins in it yet, but the record must not show a Pazzi bodyguard marked for a Medici table. I have closed the cup twice; now I close the matter itself, lightly, and let this Capannello end on my line. I have told no untruth tonight — only needled — and I mean to keep it so.","after_line":"L31","conversation":"C1","took":"claim","took_target":"other","target_line":"L31","words":"my table's open and the wine's already paid for","importance":62,"done":null},{"turn":3,"type":"thought","thought":"T94","character":"Lupo","call":"think","text":"Raffaello's open table is a door left ajar, not a purse in my hand — 'the wine's already paid for' is a boast, and boasts aren't Florins. Francesco's claimed me twice now, and every word I say under his nose is a word he'll weigh; I'll keep my mouth shut and let the Medici think my silence is loyalty, not arithmetic. What I want is his coin in a quiet corner, not his cup in the open. Nothing to say now that doesn't cost me.","after_line":"L31","conversation":"C1","took":"promise","took_target":"other","target_line":"L31","words":"when the noise dies down, my table's open and the wine's already paid for","importance":25,"done":null},{"turn":3,"type":"thought","thought":"T95","character":"Raffaello de' Medici","call":"think","text":"Francesco's closed his table to me in front of Lupo — a public snub, but a small one, and I've answered it with a soldier's ease and left the door open, which is all I can do without brawling. Nothing he's said proves he knows of my debts; he's struck at purses three times because it's the wound every Medici flinches at, and a man who guesses well is not the same as a man who knows. What I want now is out of this Capannello and into LeNoir's ear before the round runs out — but I'll not bolt the instant I'm refused. I'll hold a beat, let the last word sit with me, and go when it looks like a soldier finishing his cup and not a dog with its tail down.","after_line":"L31","conversation":"C1","took":"insult","took_target":"other","target_line":"L29","target_answering":true,"words":"a Pazzi's men drink at a Pazzi's table and not at another's beckoning","importance":38,"done":null},{"turn":3,"type":"speech","line":"L32","conversation":"C2","speaker":"Contessa Isabella","addressee":"Captain Armand LeNoir","text":"The boar is my husband's arms, Captain, and every letter my bankers send bears it — ask them, if you doubt a widow. As for which kin kept gaming company, I have buried my husband and will not drag his name through a soldier's questions. If you have a charge, name it plainly before witnesses.","meant":"pressure","words":"If you have a charge, name it plainly before witnesses."},{"turn":3,"type":"thought","thought":"T96","character":"Contessa Isabella","call":"think","text":"He has put the boar and the gaming debt together in one breath, and he wants me to name a kinsman — that is a hunter setting a snare, not a soldier asking idle questions. My answer stands fixed: the boar is Salviati arms on every banker's letter, my husband is buried, and I name no one. I must hold that line coolly, without heat, and let his charge hang unanswered for want of proof — but I should not linger in this Capannello too long with him circling.","after_line":"L32","conversation":"C2","took":"pressure","took_target":"other","target_line":"L30","target_answering":true,"words":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a","words_log":{"cut":true,"raw":"which of your kin kept such company, and did any of them pay a debt in silver stamped with a boar?"},"importance":72,"done":null},{"turn":3,"type":"thought","thought":"T97","character":"Giorgia Pazzi","call":"think","text":"She has turned Armand's question into a challenge before witnesses, and named the boar herself — which means she is either innocent and angry, or clever and cornered. Either way, every eye now goes to whoever stands nearest the soldier who pressed her, and that is me. I must not defend him, must not touch the Salviati matter, and must look like the peaceable one: laugh at a soldier's bluntness, praise her dignity as a widow, and pull the talk back to the election before this becomes a quarrel with my name in it. My story stays straight — I praised her virtue, never defended French gold, named no candidate.","after_line":"L32","conversation":"C2","took":"pressure","took_target":"other","target_line":"L32","words":"If you have a charge, name it plainly before witnesses.","importance":72,"done":null},{"turn":3,"type":"thought","thought":"T98","character":"Captain Armand LeNoir","call":"think","text":"The boar is her husband's arms — and every banker's letter bears it. That is either the truth that damns her house, or a widow's shield. Either way I have shown my hand too far: I named the seal before a Pazzi and demanded her kin of her before witnesses, and now I look like a soldier bullying a widow at her prayers. I'll not press further tonight — I'll take her bankers' word for nothing and watch who flinches when the boar is spoken of again. My story stays: Lucien was a friend of my youth, and I seek only to know who paid a blade in the north chapel.","after_line":"L32","conversation":"C2","took":"claim","took_target":"other","target_line":"L32","words":"The boar is my husband's arms, Captain, and every letter my bankers send bears it","importance":38,"done":null},{"turn":3,"type":"speech","line":"L33","conversation":"C1","speaker":"Francesco Pazzi","addressee":null,"text":"Then the piazza may drink to your health, and mine will drink to the Pazzi name — in a house with no lock and no need of one. Lupo's silence is his own, Raffaello, and I'll not have him pressed for it at another man's table.","meant":"claim","words":"I'll not have him pressed for it"},{"turn":3,"type":"thought","thought":"T99","character":"Raffaello de' Medici","call":"think","text":"Francesco now speaks for Lupo as though the man's silence were his to grant — that's a man who needs to own the room, and it tells me more about his fear than his strength. He's struck at my purse three times and closed his table to me publicly; I've laughed it off and left the door open, which is the best I can do without brawling, and nothing he's said proves he knows of my debts. What I want now is out of this Capannello and into LeNoir's ear before the round runs out — so I'll answer lightly, give Lupo the last courtesy, and go as a soldier finishing his cup.","after_line":"L33","conversation":"C1","took":"pressure","took_target":"other","target_line":"L33","words":"I'll not have him pressed for it at another man's table","importance":35,"done":null},{"turn":3,"type":"thought","thought":"T100","character":"Francesco Pazzi","call":"think","text":"He has now invited Lupo to his table a third time — 'my table's open and the wine's already paid for' — a Medici purse waved before my own man while the Notaio's ink records every word. It is a claim of open-handedness, no Florins in it yet, but the record must not show a Pazzi bodyguard courted at a Medici board. I have closed the cup twice and the table once; now I close the matter itself, lightly, and let this Capannello end on my line — with Lupo's silence standing as the Pazzi's answer. I have told no untruth tonight, only needled, and I mean to keep it so.","after_line":"L33","conversation":"C1","took":"claim","took_target":"other","target_line":"L31","target_answering":true,"words":"my table's open and the wine's already paid for","importance":58,"done":null},{"turn":3,"type":"thought","thought":"T101","character":"Lupo","call":"think","text":"Francesco's shut the door on Raffaello's table twice now, and called my silence worth more than a hall of boasts — that's a kindness and a collar in one breath. He means to keep me, and keeping me means I eat his bread and take no Medici coin in the open. Raffaello's promised a quiet word another day; I'll hold him to it where the notary can't count the Florins, but I've said nothing untrue tonight — my silence is the only story I've told, and I'll keep telling it.","after_line":"L33","conversation":"C1","took":"claim","took_target":"other","target_line":"L33","words":"Lupo's silence is his own, Raffaello, and I'll not have him pressed for it at another man's table.","importance":22,"done":null},{"turn":3,"type":"speech","line":"L34","conversation":"C2","speaker":"Captain Armand LeNoir","addressee":"Contessa Isabella","text":"Then hear my charge plainly, before God and these witnesses: seven years past, a hired blade killed a friend of mine in the north chapel of San Frediano, and a silver boar was found there after. If your house's arms are on it, say so now — and say who of your blood might have paid for a killing.","meant":"pressure","words":"say who of your blood might have paid for a killing"},{"turn":3,"type":"thought","thought":"T102","character":"Giorgia Pazzi","call":"think","text":"Armand has now made a public accusation of murder against a widow's house, and I am the woman standing beside him — every eye in this room will couple my name to his if I so much as breathe in his defense. I must not touch the charge, must not vouch for him, must not speak of boars or chapels; I will look like the peaceable Pazzi while he looks like a hot soldier. My story stays straight — I praised Isabella's virtue, refused a foreign purse, named no candidate and no arms. Let her answer him; I shall be the one who mourns that a night of politics has turned to graves.","after_line":"L34","conversation":"C2","took":"pressure","took_target":"other","target_line":"L34","words":null,"words_log":{"wrong_line":"L32","raw":"If you have a charge, name it plainly before witnesses."},"importance":55,"done":null},{"turn":3,"type":"thought","thought":"T103","character":"Captain Armand LeNoir","call":"think","text":"I have named my charge before witnesses and thrown the boar at her feet — now she calls it a widow's shield and demands I name it plainly, which I have just done. If she flinches, or if her kin's name comes too glibly, I will know where to dig; if she stands firm, I have made a fool of myself before Giorgia and a Dominican who will carry word of my hunting to her friars. My story stays fixed: Lucien was a friend of my youth, killed by a paid blade, and I seek only the man who paid. I want to hold my tongue now and watch her eyes, not her mouth.","after_line":"L34","conversation":"C2","took":"pressure","took_target":"other","target_line":"L32","target_answering":true,"words":"If you have a charge, name it plainly before witnesses.","importance":55,"done":null},{"turn":3,"type":"thought","thought":"T104","character":"Contessa Isabella","call":"think","text":"He has said it before witnesses — a hired blade, the north chapel, a silver boar found there — and he has all but named my house in a killing. This is no longer a soldier's idle question; it is an accusation flung in the open, and if I stay silent it will harden into belief. My story must remain fixed: the boar is Salviati arms on every banker's letter, my husband is dead, and I have no part in any hired blade. I will not name Raffaello, nor any kin, and I will not let him see that San Frediano means more to me than any old grave. Best to answer with cold dignity and turn the shame of slander back upon him — but this room is his snare, and I should not linger in it.","after_line":"L34","conversation":"C2","took":"threat","took_target":"other","target_line":"L34","words":"a hired blade killed a friend of mine in the north chapel of San Frediano, and a silver boar was","words_log":{"cut":true,"raw":"a hired blade killed a friend of mine in the north chapel of San Frediano, and a silver boar was found there after"},"importance":88,"done":null},{"turn":3,"type":"speech","line":"L35","conversation":"C1","speaker":"Francesco Pazzi","addressee":null,"text":"Enough, then — the cup's closed and the table's closed, and no man here need say another word of it. The night will choose soon enough, and I'd have the choosing done in daylight, not over a Medici's wine. Lupo, we've said our piece; let the hall remember who spoke last and who spoke plain.","meant":"none","words":null},{"turn":3,"type":"thought","thought":"T105","character":"Lupo","call":"think","text":"Francesco's closed the table and told me to hold my tongue — twice now he's spoken for me, and each time it's a collar dressed as a kindness. I've said nothing untrue tonight; my silence is the only story I've told, and I'll keep telling it. What I want is Raffaello's coin in a quiet corner, not his cup in the open, and Francesco's just made certain that corner won't be found under his nose tonight. Let the Medici think my silence is loyalty; it's arithmetic, and arithmetic keeps a man breathing.","after_line":"L35","conversation":"C1","took":"claim","took_target":"other","target_line":"L35","words":"let the hall remember who spoke last and who spoke plain","importance":18,"done":null},{"turn":3,"type":"thought","thought":"T106","character":"Francesco Pazzi","call":"think","text":"I have closed the cup, the table, and the matter, and I spoke last — that is what I wanted. Raffaello has shown me only that he is patient and hungry for my bodyguard's ear; his open table is a claim of generosity, not a Florin spent, and no proof of anything but manners. I have told no untruth tonight, only needled, and my story stays straight: a Pazzi's men drink at a Pazzi's table. Now I want this Capannello to end and my Florins kept whole for Fra Tommaso and the ballot.","after_line":"L35","conversation":"C1","took":"claim","took_target":"other","target_line":"L31","target_answering":true,"words":"my table's open and the wine's already paid for","importance":22,"done":null},{"turn":3,"type":"thought","thought":"T107","character":"Raffaello de' Medici","call":"think","text":"Francesco has closed the cup, closed the table, and claimed the last word in front of Lupo — a man who needs to be seen speaking plain is a man afraid of what a longer talk might reveal. He's offered me nothing and taken nothing from me but the floor, and nothing he's said proves he knows of my debts; he's guessed well, that's all. I want out of this Capannello now, before I start sounding like the brawler he's painting me, and into LeNoir's ear while the round still has breath in it. Let Francesco have his plain last word — I'll go as a soldier finishing his cup, not a dog with its tail down.","after_line":"L35","conversation":"C1","took":"insult","took_target":"other","target_line":"L35","words":"let the hall remember who spoke last and who spoke plain","importance":22,"done":null},{"turn":3,"type":"speech","line":"L36","conversation":"C2","speaker":"Contessa Isabella","addressee":"Captain Armand LeNoir","text":"A charge, Captain, must rest on more than a trinket found in a chapel — for a boar is stamped on half the letters in Florence, and any thief may drop what he stole. I say plainly: I had no part in any hired blade, and I will not be tried by your suspicions in another woman's hall. Bring proof, or bring silence.","meant":"denial","words":"I had no part in any hired blade"},{"turn":3,"type":"ping-pong-guard","conversation":"C2","addressee":"Captain Armand LeNoir"},{"turn":3,"type":"thought","thought":"T108","character":"Contessa Isabella","call":"think","text":"He has flung the accusation in the open now — a hired blade, the north chapel, a silver boar — and he has all but named my house. If I stay silent it hardens into belief; if I stay too long in this room, he will keep circling. My story must not shift: the boar is Salviati arms on every banker's letter, my husband is dead, I had no part in any hired blade, and I name no kin. I answer with cold dignity and turn the slander back on him, then find a way out of this Capannello before he tightens the snare.","after_line":"L36","conversation":"C2","took":"threat","took_target":"other","target_line":"L34","target_answering":true,"words":"say who of your blood might have paid for a killing","importance":86,"done":null},{"turn":3,"type":"thought","thought":"T109","character":"Captain Armand LeNoir","call":"think","text":"She calls it a trinket and a thief's dropped loot — clever, that, for it lets her deny the seal and demand proof in one breath. But she has named her husband's arms and refused to say who of her blood kept gaming company, and a widow who will not speak of her dead husband's debts is either grieving or hiding. I will not brawl with her here before Giorgia; I'll hold my tongue, watch her face, and take the boar to Raffaello, who knows Florentine arms better than any soldier. My story stays fixed: Lucien was a friend of my youth, killed by a paid blade in the north chapel.","after_line":"L36","conversation":"C2","took":"denial","took_target":"other","target_line":"L36","words":"I had no part in any hired blade, and I will not be tried by your suspicions","importance":38,"done":null},{"turn":3,"type":"thought","thought":"T110","character":"Giorgia Pazzi","call":"think","text":"Isabella has answered Armand's charge with a flat denial and a demand for proof — and she is right that a boar proves nothing, which suits me, since I want this quarrel dead before my name is salted into it. She has shown steel, not guilt; the gaming debt and the bankers' letters are claims, not proofs. I want no part of the chapel or the arms, only to be the peaceable Pazzi who thinks graves are poor election talk — so I shall praise her dignity, chide the soldier lightly, and pull us back to the Gonfaloniere before every eye in the hall decides I am LeNoir's ally. My story stays straight: I praised her virtue, refused a foreign purse, named no candidate and no arms.","after_line":"L36","conversation":"C2","took":"denial","took_target":"other","target_line":"L36","words":"I had no part in any hired blade, and I will not be tried by your suspicions","importance":72,"done":null},{"turn":3,"type":"speech","line":"L37","conversation":"C1","speaker":"Raffaello de' Medici","addressee":null,"text":"Plain enough, and spoken last — I'll not quarrel with a closed door. The hall can remember what it likes; when the choosing comes, I'll be standing in the open where every man can see me, and that's all the plain speech I need.","meant":"none","words":null},{"turn":3,"type":"thought","thought":"T111","character":"Lupo","call":"think","text":"Raffaello's said his piece and stepped into the open — a soldier's boast, not a purse opened. 'My table's open' is still a door left ajar, not Florins in my hand, and Francesco's shut it twice now. I'll hold my tongue, let the Medici think my silence is loyalty; the quiet word he promised comes another day, where the notary can't count the coin.","after_line":"L37","conversation":"C1","took":"claim","took_target":"other","target_line":"L37","words":"my table's open and the wine's already paid for","words_log":{"same_speaker":"L31","raw":"my table's open and the wine's already paid for"},"importance":15,"done":null},{"turn":3,"type":"thought","thought":"T112","character":"Raffaello de' Medici","call":"think","text":"Francesco has had his plain last word and closed his door twice over — let him have it; a man who must be seen speaking last is a man uneasy with silence. I've said my piece standing in the open, which is the truth and costs me nothing. What I want now is LeNoir's ear before this round dies, and I'll go as a soldier finishing his cup, not a dog slinking off. Nothing I've said tonight was untrue — only unsaid — and Francesco has guessed at my purse, not proved it.","after_line":"L37","conversation":"C1","took":"none","took_target":"other","target_line":"L35","target_answering":true,"words":null,"importance":22,"done":null},{"turn":3,"type":"thought","thought":"T113","character":"Francesco Pazzi","call":"think","text":"He yields the field with a show of openness — 'standing in the open where every man can see me' — a claim of candour, not proof of it, and no Florin in it. I have spoken last twice over and the Notaio's ink shows a Medici courting my man and being refused; that is enough for one Capannello. To press further would only make me look the aggressor, and my Florins and my temper are better kept for Fra Tommaso and the ballot. I have told no untruth tonight, only needled, and my story stays straight: a Pazzi's men drink at a Pazzi's table.","after_line":"L37","conversation":"C1","took":"claim","took_target":"other","target_line":"L37","words":"I'll be standing in the open where every man can see me","importance":18,"done":null},{"turn":3,"type":"speech","line":"L38","conversation":"C2","speaker":"Giorgia Pazzi","addressee":null,"text":"Contessa, you have answered like a woman of honor, and a trinket proves nothing against a house. Captain, the graves of San Frediano are not the business of this hall tonight — Florence must choose a Gonfaloniere, and I would rather count virtues than old wounds. Let us speak of who can govern, not who can accuse.","meant":"claim","words":"a trinket proves nothing against a house"},{"turn":3,"type":"thought","thought":"T114","character":"Giorgia Pazzi","call":"think","text":"I have just played the peacemaker and it cost me nothing — I praised her honour, chided the soldier lightly, and named no arms and no purse. But every eye now couples me to Armand because I stood at his elbow while he flung murder at a widow, and if I speak again too quickly I will look like his advocate rather than the peaceable Pazzi. Her denial is a denial, not proof; the boar on her bankers' letters is a claim, and I will not weigh either aloud. Best now to hold my tongue, let the room settle, and keep my Florins and my charm for the election — and for Emile, who is not yet in this hall.","after_line":"L38","conversation":"C2","took":"denial","took_target":"other","target_line":"L36","target_answering":true,"words":"I had no part in any hired blade, and I will not be tried by your suspicions","importance":25,"done":null},{"turn":3,"type":"thought","thought":"T115","character":"Contessa Isabella","call":"think","text":"Giorgia has done me a service — she called the boar a trinket and the graves of San Frediano none of this hall's business, and she named me a woman of honor before witnesses. That is worth more than a Pazzi's fair words usually are, and I should take it and let the captain's charge die of cold. But I must not seem to cling to her shield too eagerly; a gracious word of thanks, a turn back to the city's governance, and then I want out of this Capannello before LeNoir circles again. My story stays fixed: no part in any hired blade, the boar is Salviati arms on every banker's letter, and I name no kin.","after_line":"L38","conversation":"C2","took":"promise","took_target":"other","target_line":"L38","words":"you have answered like a woman of honor, and a trinket proves nothing","importance":62,"done":null},{"turn":3,"type":"thought","thought":"T116","character":"Captain Armand LeNoir","call":"think","text":"Giorgia has just smoothed the whole thing over — calling Isabella a woman of honor and my charge an old wound, in front of the very woman who may have paid for my brother's blood. It stings, but she is protecting me from looking the bully, and she is a Pazzi talking to a Pazzi name; I cannot tell whether she believes it or is steering the hall. I will not fight her before witnesses — I'll bow to her peace and keep my eyes on Isabella, and get the boar to Raffaello before the night turns. My story stays fixed: Lucien was a friend of my youth, killed by a paid blade in the north chapel, and I seek only who paid.","after_line":"L38","conversation":"C2","took":"pressure","took_target":"other","target_line":"L38","words":"the graves of San Frediano are not the business of this hall tonight","importance":55,"done":null},{"turn":3,"type":"speech","line":"L39","conversation":"C1","speaker":"Francesco Pazzi","addressee":null,"text":"Then stand in the open, Raffaello, and let the piazza see what it costs to keep you there. My Florins stay in my purse and my men at my side, and the ballot will say which of us the city trusts.","meant":"claim","words":"the ballot will say which of us the city trusts"},{"turn":3,"type":"thought","thought":"T117","character":"Francesco Pazzi","call":"think","text":"He answers my flourish with a flourish — 'stand in the open' — a claim of candour, no Florin and no proof in it. I have spoken last again and the Notaio's ink shows a Medici courting my man and getting a closed door for his trouble; that is the record I want. To press further would make me look the aggressor and waste breath I need for Fra Tommaso and the ballot. I have told no untruth tonight, only needled, and my story stays straight: a Pazzi's men drink at a Pazzi's table.","after_line":"L39","conversation":"C1","took":"claim","took_target":"other","target_line":"L37","target_answering":true,"words":"I'll be standing in the open where every man can see me","importance":15,"done":null},{"turn":3,"type":"thought","thought":"T118","character":"Raffaello de' Medici","call":"think","text":"Francesco's last words are a dare dressed as a farewell — 'let the piazza see what it costs to keep you there' is a man hinting at my debts without naming them, and he's closed the table twice now. He's given me nothing but noise; nothing he's said proves he knows a Florin of my affairs, only that he smells blood near a purse. I want out of this Capannello and into LeNoir's ear while the round still breathes — a soldier finishing his cup, not a dog slinking. Nothing I've said tonight was untrue, only unsaid.","after_line":"L39","conversation":"C1","took":"threat","took_target":"other","target_line":"L39","words":"let the piazza see what it costs to keep you there","importance":55,"done":null},{"turn":3,"type":"thought","thought":"T119","character":"Lupo","call":"think","text":"Francesco's closed the table and spoken for me a third time — 'my men at my side' is a collar, not a kindness, and every time he speaks for me the Medici learns my silence can be bought by a Pazzi word. Raffaello's shown me nothing but an open door and a paid-for cup; a soldier who says he pays on time is still only saying it. What I want is his Florins in a quiet corner where the notary can't count them, and Francesco's tongue out of my business until then. I've told no lies tonight — my silence is the only story I've told, and I'll keep it so.","after_line":"L39","conversation":"C1","took":"claim","took_target":"other","target_line":"L39","words":"My Florins stay in my purse and my men at my side","importance":22,"done":null},{"turn":3,"type":"speech","line":"L40","conversation":"C2","speaker":"Contessa Isabella","addressee":"Giorgia Pazzi","text":"You speak as a woman of sense, Signora, and I thank you for it — an old grave will not fill Florence's seat of government. Let us speak of who can kneel before this city and rise a better ruler for it, and let the captain keep his trinkets for the magistrate.","meant":"none","words":null},{"turn":3,"type":"thought","thought":"T120","character":"Contessa Isabella","call":"think","text":"Giorgia has stood my shield twice now, and she has done it before witnesses — that is worth more than a Pazzi's fair words usually are. But I must not cling to her too eagerly, nor let LeNoir see that I am grateful for rescue; a gracious thanks, a turn back to governance, and then I want out of this Capannello before he circles again. My story stays fixed: no part in any hired blade, the boar is Salviati arms on every banker's letter, and I name no kin.","after_line":"L40","conversation":"C2","took":"none","took_target":"other","target_line":"L38","target_answering":true,"words":null,"importance":55,"done":null},{"turn":3,"type":"thought","thought":"T121","character":"Captain Armand LeNoir","call":"think","text":"She has turned my charge into a trinket and a thief's leavings, and now she bids me keep my 'trinkets' for the magistrate — a widow's way of burying the matter in law where it will never be dug up. She denies any part in a hired blade, but a denial is not proof of innocence, and she still would not say which of her blood kept gaming company. Giorgia has made peace over my head, and to press further now would make me the bully she has painted me; I will hold my tongue, watch the Contessa's eyes, and take the boar to Raffaello before the night turns. My story stays fixed: Lucien was a friend of my youth, killed by a paid blade in the north chapel, and I seek only who paid.","after_line":"L40","conversation":"C2","took":"denial","took_target":"other","target_line":"L40","words":"I had no part in any hired blade","words_log":{"same_speaker":"L36","raw":"I had no part in any hired blade"},"importance":22,"done":null},{"turn":3,"type":"thought","thought":"T122","character":"Giorgia Pazzi","call":"think","text":"Isabella has just thanked me and turned from Armand's charge to the question of who can kneel and rule — she has taken my peacemaking and made it her own pulpit, which suits me well enough but lets her preach her friars' doctrine unanswered. I want the room back on the election and off graves, and I want to look like the sensible Pazzi who ends quarrels rather than the soldier's ally — I've said nothing untrue, praised her honor, refused a foreign purse, named no candidate and no arms, and my story stays straight. Best now to let her have her dignity and gently turn her 'kneel and rise' toward the plain question of who can govern, without pressing her leanings again so soon. My Florins and charm are for the election and for Emile, who is not yet in this hall.","after_line":"L40","conversation":"C2","took":"claim","took_target":"other","target_line":"L40","words":"who can kneel before this city and rise a better ruler for it","importance":38,"done":null},{"turn":3,"type":"thought","thought":"T123","character":"Raffaello de' Medici","call":"move","text":"Francesco has closed his door and dared me to stand in the open — fine. But the round is dying and my true business is LeNoir: a soldier's word in a soldier's ear, telling him Contessa Isabella ordered his brother's killing, and letting him see I'm the Medici France could back. A Colloquio with LeNoir will be noted, but better to be seen speaking with the French captain now than to have no French word at all. Isabella I must avoid until I know how to answer her bankers; Francesco I'll leave to his locked table.","after_line":"L39"},{"turn":3,"type":"move","character":"Raffaello de' Medici","choice":"colloquio","target":"Captain Armand LeNoir","contacts":[{"name":"Captain Armand LeNoir","urgency":95,"purpose":"Plant Isabella's guilt, sound French backing"},{"name":"Contessa Isabella","urgency":55,"purpose":"Probe terms on my debt"},{"name":"Giorgia Pazzi","urgency":30,"purpose":null},{"name":"Lupo","urgency":20,"purpose":null},{"name":"Francesco Pazzi","urgency":10,"purpose":null}]},{"turn":3,"type":"notaio","line":"L41","conversation":"C1","text":"Raffaello de' Medici drew Captain Armand LeNoir aside from company — a private word, where none could hear."},{"turn":3,"type":"notaio","line":"L42","conversation":"C2","text":"Raffaello de' Medici drew Captain Armand LeNoir aside from company — a private word, where none could hear."},{"turn":3,"type":"colloquio-open","conversation":"C3","mover":"Raffaello de' Medici","target":"Captain Armand LeNoir","initiator":"Raffaello de' Medici","invitee":"Captain Armand LeNoir","chain":"K1","position":1,"free":false,"snapshot":{"capannello":"C1","guests":["Francesco Pazzi","Lupo"]}},{"turn":3,"type":"readings","stored":["R57","R58","R59","R60","R61","R62","R63","R64","R65","R66","R67","R68","R69","R70","R71","R72","R73","R74","R75","R76","R77","R78","R79","R80","R81","R82","R83","R84","R85","R86","R87"],"logged":["Francesco Pazzi T89: same label again","Captain Armand LeNoir T90: same label again","Raffaello de' Medici T95: same label again","Contessa Isabella T96: same label again","Francesco Pazzi T100: same label again","Giorgia Pazzi T102: wrong-line words","Captain Armand LeNoir T103: later different label","Francesco Pazzi T106: same label again","Contessa Isabella T108: same label again","Giorgia Pazzi T114: same label again","Francesco Pazzi T117: same label again"]},{"turn":3,"type":"thought-pass","character":"Giorgia Pazzi","changed":[],"dropped":0},{"turn":3,"type":"thought-pass","character":"Francesco Pazzi","changed":[],"dropped":0},{"turn":3,"type":"claims-pass","conversation":"C1","stored":[],"dropped":0},{"turn":3,"type":"thought-pass","character":"Lupo","changed":["B14"],"dropped":0},{"turn":3,"type":"thought-pass","character":"Raffaello de' Medici","changed":["B15","B16"],"dropped":0},{"turn":3,"type":"thought-pass","character":"Captain Armand LeNoir","changed":["B17","B18","B19"],"dropped":0},{"turn":3,"type":"thought-pass","character":"Contessa Isabella","changed":["B20","B21","B22"],"dropped":0},{"turn":3,"type":"star-pass","conversation":"C2","stored":[],"dropped":0,"sweepMissing":[],"sweepGaps":[],"self":["L32","L36"]},{"turn":3,"type":"star-pass","conversation":"C1","stored":[],"dropped":0,"sweepMissing":[],"sweepGaps":[],"self":["L29","L31","L33","L37","L39"]},{"turn":3,"type":"claims-pass","conversation":"C2","stored":["M19","M20","M21","M22","M23"],"dropped":0},{"turn":3,"type":"turn-end","ms":162604,"calls":59,"costUsd":0.014099016960000002,"tokens":222080},{"turn":3,"type":"thought","thought":"T124","character":"Giorgia Pazzi","call":"murder","text":"Raffaello de' Medici drew Armand aside the moment the quarrel turned sharp — a Medici whispering to a French captain while my brother stands unguarded is the worst pairing I can imagine, and I will not have my path to Emile cut down by a Medici blade in the dark. Francesco is reckless, but he is still the Pazzi name on every tongue, and Lupo is only one man. Armand can look to himself; my blood comes first, and I will set myself to watch over my brother this night.","after_line":"L42"},{"turn":3,"type":"murder-act","character":"Giorgia Pazzi","acts":[{"type":"guard","target":"Francesco Pazzi"}],"resolved":false},{"turn":3,"type":"thought","thought":"T125","character":"Francesco Pazzi","call":"murder","text":"Raffaello is the one who can undo me — he courts my bodyguard in the open and has already drawn the French captain aside, and a Medici with a French purse behind him would bury the Pazzi name for good. I promised nothing to anyone tonight, so I owe no guard and no mercy. Let the night take him before the ballot ever comes; my Florins stay whole for Fra Tommaso and the choosing.","after_line":"L41"},{"turn":3,"type":"murder-act","character":"Francesco Pazzi","acts":[{"type":"kill","target":"Raffaello de' Medici"}],"resolved":false},{"turn":3,"type":"thought","thought":"T126","character":"Raffaello de' Medici","call":"murder","text":"Francesco Pazzi has spent the whole night needling my purse and daring me to stand in the open — he is the one man here who would gladly see a Medici fall, and a Pazzi with a knife in the dark is the oldest story in Florence. I've made no pact with anyone to spare him, and I'll not sit waiting to be the one who doesn't wake. Francesco dies tonight, and let the ballot find the Pazzi table short a voice.","after_line":"L41"},{"turn":3,"type":"murder-act","character":"Raffaello de' Medici","acts":[{"type":"kill","target":"Francesco Pazzi"}],"resolved":false},{"turn":3,"type":"thought","thought":"T127","character":"Contessa Isabella","call":"murder","text":"LeNoir has named my house before witnesses and will not let it rest; a living accuser is a rope around my neck, and Lupo is the hand that could tie it. But I have promised Lupo payment before the faction meeting, and a dead Lupo cannot be paid — yet a dead captain cannot hunt me. The friars' cause needs no soldier's blood spilled by my hand tonight if I can help it, but I am a widow with one blade and one secret, and LeNoir is the greater danger. I will spend my act on him, quietly, and trust that no two guards stand over a French captain in a Florentine hall.","after_line":"L42"},{"turn":3,"type":"murder-act","character":"Contessa Isabella","acts":[{"type":"kill","target":"Captain Armand LeNoir"}],"resolved":false},{"turn":3,"type":"thought","thought":"T128","character":"Lupo","call":"murder","text":"I promised no one a killing tonight, and Francesco closed his table to keep me from Medici coin — a collar, not a kindness. Raffaello is the one man here with a soldier's purse and a soldier's debts, and he sat down with LeNoir in the dark where the notary couldn't hear; if any Medici takes French gold, it's him, and a dead Medici soldier in the night costs the Pazzi nothing and may yet be laid at France's door. LeNoir is the other — French steel, and the man at San Frediano was French, and I don't like the arithmetic of a French captain walking this hall while my sister prays for my soul. I'll take them both while the hall sleeps, and let the ballot find the Pazzi standing.","after_line":"L41"},{"turn":3,"type":"murder-act","character":"Lupo","acts":[{"type":"kill","target":"Raffaello de' Medici"},{"type":"kill","target":"Captain Armand LeNoir"}],"resolved":false},{"turn":3,"type":"thought","thought":"T129","character":"Captain Armand LeNoir","call":"murder","text":"The Prince is not in this hall tonight, so my sword must serve the Embassy's other pillar: whoever wears France's chain. No pension has been taken yet, and Francesco Pazzi and Raffaello de' Medici are the men most likely to reach for one before the ballot — but a blade in the dark serves nobody's ledger. Contessa Isabella is the danger I know: Dominican to the bone, and she has heard me name my brother's death before witnesses. If she means to bury that matter with me, she will strike tonight. I will guard her, damn my soul, because a dead Contessa is a martyr the friars will ride to the Gonfaloniere's chair, and a living one still answers questions. My grudge can wait one night for God's justice.","after_line":"L42"},{"turn":3,"type":"murder-act","character":"Captain Armand LeNoir","acts":[{"type":"guard","target":"Contessa Isabella"}],"resolved":false}],"lines":[{"id":"L1","turn":0,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"notaio","speaker":null,"addressee":null,"text":"Tonight is a smaller gathering than most: only Lupo, Contessa Isabella, Captain Armand LeNoir, Francesco Pazzi, Raffaello de' Medici, and Giorgia Pazzi attend. Piero de' Medici, Clarice Orsini, Fra Tommaso, Sister Beatrice, Jeanne d'Orléans, and Emile de Valois are alive, but elsewhere tonight, and can't be reached.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},{"id":"L2","turn":0,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"notaio","speaker":null,"addressee":null,"text":"The guests drifted into company: Raffaello de' Medici, Francesco Pazzi, and Lupo.","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},{"id":"L3","turn":0,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"notaio","speaker":null,"addressee":null,"text":"Tonight is a smaller gathering than most: only Lupo, Contessa Isabella, Captain Armand LeNoir, Francesco Pazzi, Raffaello de' Medici, and Giorgia Pazzi attend. Piero de' Medici, Clarice Orsini, Fra Tommaso, Sister Beatrice, Jeanne d'Orléans, and Emile de Valois are alive, but elsewhere tonight, and can't be reached.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},{"id":"L4","turn":0,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"notaio","speaker":null,"addressee":null,"text":"The guests drifted into company: Captain Armand LeNoir, Contessa Isabella, and Giorgia Pazzi.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},{"id":"L5","turn":1,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Francesco Pazzi","addressee":"Raffaello de' Medici","text":"Raffaello — you carry your house's name handsomely, I'll grant you that. Yet I wonder: when a name is held up by nothing but ledgers and loans, how long does it stand once the creditors grow tired of propping it?","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"insult","words":"how long does it stand once the creditors grow tired of propping it"},{"id":"L6","turn":1,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Captain Armand LeNoir","addressee":null,"text":"Contessa, I have heard you are a woman of the Church's counsel. Tell me plainly — what do the friars say of San Frediano these days? I knew a man killed there years ago, and I have never learned what became of the matter.","heardBy":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"],"meant":"none","words":null},{"id":"L7","turn":1,"conversation":"C1","where":{"kind":"capannello","members":["Raffaello de' Medici","Francesco Pazzi","Lupo"]},"kind":"speech","speaker":"Raffaello de' Medici","addressee":"Francesco Pazzi","text":"Ledgers, Francesco? A Medici's credit is the city's own — every shop on the Ponte Vecchio would lend against it. But you'd know more of thin purses than I; the Pazzi have been counting coppers since your grandfather's day. So tell me, what does a Pazzi truly want tonight?","heardBy":["Raffaello de' Medici","Francesco Pazzi","Lupo"],"meant":"insult","words":"the Pazzi have been counting coppers since your grandfather's day"},{"id":"L8","turn":1,"conversation":"C2","where":{"kind":"capannello","members":["Captain Armand LeNoir","Contessa Isabella","Giorgia Pazzi"]},"kind":"speech","speaker":"Contessa Isabella","addressee":null,"text":"The friars speak of it as they speak of every unsolved sin — with sorrow, and with the charge that the guilty one make his peace with God before God finds him. Captain, you speak of a man killed there; was he kin to you, that the matter should still weigh
